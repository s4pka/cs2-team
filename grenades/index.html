<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Карта гранат</title>
<link rel="icon" href="data:,">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Oswald:wght@500;600&display=swap">
<style>
/* Layout: icon rail | map that fills the height | quiet side panel. On phones: bar, map, bottom sheet. */
:root{
  --bg:#0e1216; --panel:#151b20; --raise:#1c242b; --line:#29343d; --fg:#e7ecef; --mute:#8b98a2; --accent:#f0b443;
  --smoke:#d7dee3; --flash:#ffe066; --molotov:#ff7b42; --he:#74d47a;
  --display:"Oswald","Arial Narrow",sans-serif; --body:"Golos Text",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:56px 1fr 340px;grid-template-rows:100%}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:14px;border-right:1px solid var(--line);background:var(--panel)}
.logo{font:600 15px var(--display);letter-spacing:.06em;color:var(--accent);margin-bottom:10px}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--mute);position:relative;text-decoration:none}
.ib:hover{background:var(--raise);color:var(--fg)}
.ib[aria-pressed=true]{background:var(--raise);color:var(--fg)}
.ib svg{width:20px;height:20px;stroke-width:1.8}
.tip{position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);white-space:nowrap;background:#000c;padding:4px 8px;border-radius:6px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:30}
.ib:hover .tip,.ib:focus-visible .tip{opacity:1}
.tip.down{left:50%;top:calc(100% + 6px);transform:translateX(-50%)}
.stage{position:relative;overflow:hidden;touch-action:none;cursor:grab;background:radial-gradient(ellipse at 50% 45%,#141a20,var(--bg) 70%)}
.stage.drag{cursor:grabbing}
.stage.flat{background:#0e0f13}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.world img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
.world img.names{position:absolute;inset:0}
#marks,#links{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#links{pointer-events:none}
.bar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none;z-index:10}
.grp{pointer-events:auto;display:flex;gap:2px;padding:3px;background:#151b20e6;border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px)}
.grp .ib{width:34px;height:34px;border-radius:9px}
.grp .ib img{width:16px;height:16px;object-fit:contain;opacity:.45}
.grp .ib[aria-pressed=true] img{opacity:1}
.seg{white-space:nowrap;height:34px;padding:0 10px;border-radius:9px;font:500 13px var(--display);letter-spacing:.06em;color:var(--mute)}
.seg[aria-pressed=true]{background:var(--raise);color:var(--fg)}
.seg:disabled{opacity:.35;cursor:default}
.seg small{font:500 10px var(--display);opacity:.7;margin-left:4px;letter-spacing:.08em}
.zoom{position:absolute;right:12px;bottom:12px;z-index:10;flex-direction:column}
.card{position:absolute;z-index:8;border-radius:10px;overflow:hidden;background:#000;border:1px solid #ffffff2e;box-shadow:0 10px 30px #0009;cursor:zoom-in}
.fr{display:block;background-color:#0b0f12;background-repeat:no-repeat;background-size:300% 100%}
.card .fr{position:absolute;inset:0}
.fr.s0{background-position:0 0}.fr.s1{background-position:50% 0}.fr.s2{background-position:100% 0}
.card .lab{position:absolute;left:8px;top:8px;font:500 11px var(--display);letter-spacing:.1em;padding:3px 7px;border-radius:5px;background:#000b}
.card.aim{border-color:var(--accent)}
.card.aim .lab{color:var(--accent)}
.card .play{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;background:#000c;display:grid;place-items:center;cursor:pointer}
.card .play svg{width:16px;height:16px}
.card video.vid{background:#000}
.card .vid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;background:#0b0f12;font-size:13px;color:var(--mute)}
.cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);pointer-events:none}
.side{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:20px 20px 28px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font:500 11px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h1{font:600 26px/1.15 var(--display);letter-spacing:.01em;margin:4px 0 0;text-wrap:balance}
h2{font:500 12px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
.from{color:var(--mute);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 9px;border-radius:7px;background:var(--raise);font-size:13px}
.chip b{font-weight:600}
.why{color:var(--mute);font-size:13px}
.acts{display:flex;gap:8px}
.btn{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;background:var(--raise);font-weight:500}
.btn.main{background:var(--accent);color:#1a1205}
.btn svg{width:17px;height:17px}
.list{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;text-align:left;width:100%}
.row:hover,.row.hot{background:var(--raise)}
.row img{width:14px;height:14px;object-fit:contain;flex:none}
.row span{min-width:0}
.row small{display:block;color:var(--mute);font-size:12px}
.note{font-size:12px;color:var(--mute);border-top:1px solid var(--line);padding-top:14px}
.photos{display:none}
.lb{position:fixed;inset:0;background:#000e;z-index:50;display:grid;place-items:center;padding:24px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.lb .fr{width:min(96vw,1280px);aspect-ratio:16/9;border-radius:8px}
@media (max-width:760px){
  .app{grid-template-columns:100%;grid-template-rows:auto minmax(0,1fr) auto}
  .rail{flex-direction:row;justify-content:center;border-right:0;border-bottom:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
  .logo{margin:0 10px 0 0}
  .tip{display:none}
  .bar{left:8px;right:8px;top:8px}
  #maps{max-width:100%;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
  .side{border-left:0;border-top:1px solid var(--line);max-height:46vh;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .card{display:none}
  .photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .photos figure{margin:0;position:relative;border-radius:8px;overflow:hidden}
  .photos figure:first-child{grid-column:1/-1}
  .photos .fr{width:100%;aspect-ratio:16/9}
  .photos figcaption{position:absolute;left:6px;top:6px;font:500 10px var(--display);letter-spacing:.1em;background:#000b;padding:2px 6px;border-radius:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>

    <a class="ib" id="toList" href="../"><i data-lucide="layout-list"></i><span class="tip">Все раскидки</span></a>

      <div class="grp" id="levels" hidden></div>
    </div>
    <div class="grp zoom">
      <button class="ib" id="zin"><i data-lucide="plus"></i></button>
      <button class="ib" id="zout"><i data-lucide="minus"></i></button>
      <button class="ib" id="zfit"><i data-lucide="scan"></i></button>
    </div>
    <div id="cards"></div>
  </main>

  <aside class="side" id="side"></aside>
</div>

const mapKey = () => { const k = location.hash.slice(1).split("-")[0]; return DATA.maps[k] ? k : DATA.order[0]; };
const mapBtns = () => { $("maps").innerHTML = DATA.order.map(k => `<button class="seg" data-m="${k}" aria-pressed="${S.map===k}">${DATA.maps[k].name}${DATA.maps[k].ban?"<small>бан</small>":""}</button>`).join(""); };
function levelBtns(){ const g = $("levels"); g.hidden = !D.lower; g.innerHTML = D.lower ? [["up","Верх"],["low","Низ"]].map(([v,l]) => `<button class="seg" data-lv="${v}" aria-pressed="${S.level===v}">${l}</button>`).join("") : ""; }
function layerBtn(){ $("layer").hidden = !D.names; $("layer").setAttribute("aria-pressed", S.names && !!D.names); }
function paintImages(){
  $("radar").src = S.level === "low" && D.lower ? D.lower : D.radar; $("radar").alt = "Радар " + D.name;
  const on = S.names && !!D.names; $("names").hidden = !on; stage.classList.toggle("flat", on); if(on) $("names").src = D.names; $("names").alt = D.name + " с названиями позиций";
}
function setMap(k){
  S.map = k; D = {...DATA.maps[k], key:k, ni:DATA.ni}; S.sel = S.open = null; S.video = false; S.level = "up";
  history.replaceState(null, "", "#" + k); document.title = "Карта гранат · " + D.name;
  for(const [id, tab] of [["toList","nades"],["toNames","names"],["toCfg","cfg"]]) $(id).href = `../#${k}-${tab}-${S.side === "ct" ? "ct" : "t"}`;
  $("to3d").href = `https://www.smokepractice.com/${k}`;
  mapBtns(); levelBtns(); layerBtn(); paintImages();
  const ok = new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = D.radar; });
  ok.then(() => { fit(); });
  fit();
}
$("maps").onclick = e => { const b = e.target.closest("[data-m]"); if(b && b.dataset.m !== S.map) setMap(b.dataset.m); };
$("levels").onclick = e => { const b = e.target.closest("[data-lv]"); if(!b) return; S.level = b.dataset.lv; levelBtns(); paintImages(); };
addEventListener("hashchange", () => { if(mapKey() !== S.map) setMap(mapKey()); });
const sideBtns = () => { $("sides").innerHTML = [["all","Все"],["t","T"],["ct","CT"]].map(([v,l]) => `<button class="seg" data-v="${v}" aria-pressed="${S.side===v}">${l}</button>`).join(""); };
const kindBtns = () => { $("kinds").innerHTML = Object.keys(KIND).map(k => `<button class="ib" data-k="${k}" aria-pressed="${S.kinds.has(k)}"><img src="${D.ni[k]}" alt=""><span class="tip down">${KIND[k]}</span></button>`).join(""); };
$("sides").onclick = e => { const b = e.target.closest("[data-v]"); if(!b) return; S.side = b.dataset.v; S.sel = S.open = null; sideBtns(); render(); $("toList").href = $("toList").href.replace(/-(t|ct)$/, "-" + (S.side === "ct" ? "ct" : "t")); };
$("kinds").onclick = e => { const b = e.target.closest("[data-k]"); if(!b) return; const k = b.dataset.k; S.kinds.has(k) ? S.kinds.delete(k) : S.kinds.add(k); if(!S.kinds.size) S.kinds.add(k); S.sel = S.open = null; kindBtns(); render(); };
$("layer").onclick = () => { S.names = !S.names; layerBtn(); paintImages(); };

// view: fit, pan, zoom
let base = 1;
// the toolbar floats over the stage; the map is fitted below it when it wraps (phones) or would be covered by it (D.ct: first row of playable area)
function fit(){
  const r = stage.getBoundingClientRect(), bar = stage.querySelector(".bar").getBoundingClientRect(), under = bar.bottom - r.top + 4;
  const b0 = Math.min(r.width / D.w, (r.height - 8) / D.h), covered = (r.height - D.h*b0)/2 + 4 + D.ct*b0 < under;
  const top = innerWidth <= 760 || bar.height > 60 || covered ? under : 0, H = r.height - top;
  base = Math.min(r.width / D.w, (H - 8) / D.h); S.z = 1; S.x = (r.width - D.w*base)/2; S.y = top + (H - D.h*base)/2 + 4; apply();
}
function apply(){ world.style.width = D.w*base+"px"; world.style.height = D.h*base+"px"; world.style.transform = `translate(${S.x}px,${S.y}px) scale(${S.z})`; render(); }
const scr = ([x,y]) => [S.x + x*base*S.z, S.y + y*base*S.z];
function zoomAt(f, cx, cy){ const z = Math.min(6, Math.max(1, S.z*f)); f = z/S.z; S.x = cx - (cx - S.x)*f; S.y = cy - (cy - S.y)*f; S.z = z; apply(); }
stage.addEventListener("wheel", e => { e.preventDefault(); const r = stage.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX - r.left, e.clientY - r.top); }, {passive:false});
const P = new Map(); let moved = 0, pinch = 0;
let downT = null;
stage.addEventListener("pointerdown", e => { downT = e.target; if(e.target.closest(".bar,.zoom,.card")) return; P.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; stage.setPointerCapture(e.pointerId); });
stage.addEventListener("pointermove", e => {
  if(!P.has(e.pointerId)) return; const [px,py] = P.get(e.pointerId); P.set(e.pointerId, [e.clientX, e.clientY]);
  if(P.size === 2){ const [a,b] = [...P.values()]; const d = Math.hypot(a[0]-b[0], a[1]-b[1]); if(pinch){ const r = stage.getBoundingClientRect(); zoomAt(d/pinch, (a[0]+b[0])/2 - r.left, (a[1]+b[1])/2 - r.top); } pinch = d; moved = 99; return; }
  moved += Math.abs(e.clientX-px) + Math.abs(e.clientY-py); if(moved > 4){ stage.classList.add("drag"); S.x += e.clientX-px; S.y += e.clientY-py; apply(); }
});
const end = e => { P.delete(e.pointerId); pinch = 0; stage.classList.remove("drag"); };
stage.addEventListener("pointerup", e => { const wasDrag = moved > 4; end(e); if(wasDrag) return; const t = downT && downT.closest("[data-i],[data-c]"); if(t) pick(t); else if(!(downT && downT.closest(".bar,.zoom,.card"))){ S.sel = S.open = null; S.video = false; render(); } });
stage.addEventListener("pointercancel", end);
$("zin").onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(1.4, r.width/2, r.height/2); };
$("zout").onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(1/1.4, r.width/2, r.height/2); };
$("zfit").onclick = fit;
addEventListener("resize", fit);
addEventListener("keydown", e => { if(e.key === "Escape"){ S.sel = S.open = null; S.video = false; render(); } });

// data views
const shown = () => D.items.map((it,i) => ({...it, i})).filter(it => (S.side === "all" || it.side === S.side) && S.kinds.has(it.kind));
function clusters(list){ const out = []; for(const it of list){ const c = out.find(c => Math.hypot(c.t[0]-it.t[0], c.t[1]-it.t[1]) < 9); if(c) c.m.push(it); else out.push({t:it.t, m:[it]}); } return out; }
function pick(el){
  if(el.dataset.c !== undefined){ const c = +el.dataset.c; S.open = S.open === c ? null : c; S.sel = null; S.video = false; }
  else { S.sel = +el.dataset.i; S.video = false; }
  render();
}
function marker(it, x, y, dim, on){
  const c = col(it.kind), r = on ? 15 : 12;
  return `<g data-i="${it.i}" style="cursor:pointer;opacity:${dim?.28:1}"><circle cx="${x}" cy="${y}" r="${r+6}" fill="transparent"/>
    <circle cx="${x}" cy="${y}" r="${r}" fill="#0e1216" stroke="${c}" stroke-width="${on?3:2}"/>
    <image href="${D.ni[it.kind]}" x="${x-r*.55}" y="${y-r*.62}" width="${r*1.1}" height="${r*1.24}"/></g>`;
}
function render(){
  const list = shown(), cl = clusters(list), sel = S.sel !== null ? D.items[S.sel] : null;
  let m = "", l = "";
  cl.forEach((c, ci) => {
    const [x,y] = scr(c.t), inSel = sel && c.m.some(it => it.i === S.sel), dim = (S.open !== null && S.open !== ci) || (sel && !inSel);
    if(c.m.length === 1){ m += marker(c.m[0], x, y, dim, inSel); return; }
    if(S.open === ci || inSel){
      const n = c.m.length, R = 30 + n*2;
      m += `<circle cx="${x}" cy="${y}" r="5" fill="#e7ecef"/>`;
      c.m.forEach((it, k) => { const a = -Math.PI/2 + k*2*Math.PI/n, px = x + R*Math.cos(a), py = y + R*Math.sin(a);
        m += `<line x1="${x}" y1="${y}" x2="${px}" y2="${py}" stroke="#e7ecef55" stroke-width="1.5"/>` + marker(it, px, py, sel && it.i !== S.sel, it.i === S.sel); });
      return;
    }
    const kinds = [...new Set(c.m.map(it => it.kind))];
    m += `<g data-c="${ci}" style="cursor:pointer;opacity:${dim?.28:1}"><circle cx="${x}" cy="${y}" r="20" fill="transparent"/>
      <circle cx="${x}" cy="${y}" r="13" fill="#0e1216" stroke="#e7ecef" stroke-width="2"/>
      <image href="${D.ni[kinds[0]]}" x="${x-7}" y="${y-8}" width="14" height="16"/>
      <circle cx="${x+11}" cy="${y-11}" r="8.5" fill="#f0b443"/><text x="${x+11}" y="${y-7.5}" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1205" font-family="Golos Text,sans-serif">${c.m.length}</text></g>`;
  });
  if(sel){
    const [ax,ay] = scr(sel.t), [bx,by] = scr(sel.l), c = col(sel.kind), ang = Math.atan2(by-ay, bx-ax);
    l += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="#000a" stroke-width="5" stroke-linecap="round"/>
      <line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${c}" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round"/>
      <circle cx="${bx}" cy="${by}" r="18" fill="${c}" fill-opacity=".22" stroke="${c}" stroke-width="2"/>
      <path d="M${bx-9*Math.cos(ang)-5*Math.sin(ang)},${by-9*Math.sin(ang)+5*Math.cos(ang)} L${bx},${by} L${bx-9*Math.cos(ang)+5*Math.sin(ang)},${by-9*Math.sin(ang)-5*Math.cos(ang)}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round"/>`;
  }
  marks.innerHTML = m; links.innerHTML = l; placeCards(sel); panel(sel, list);
}

// photo cards beside the throw spot and the landing spot, on the side away from the flight line
function placeCards(sel){
  cards.innerHTML = ""; if(!sel || innerWidth <= 760) return;
  const r = stage.getBoundingClientRect(), [ax,ay] = scr(sel.t), [bx,by] = scr(sel.l);
  const W = Math.min(400, r.width*0.34), w2 = W*0.62, h1 = W*9/16, h2 = w2*9/16, gap = 8, M = 12, top = 60;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const hitSeg = (x, y, w, h) => { for(let i = 0; i <= 60; i++){ const px = ax + (bx-ax)*i/60, py = ay + (by-ay)*i/60; if(px > x-10 && px < x+w+10 && py > y-10 && py < y+h+10) return true; } return false; };
  const over = (a, b2) => a && Math.max(0, Math.min(a.x+a.w, b2.x+b2.w) - Math.max(a.x, b2.x) + 10) * Math.max(0, Math.min(a.y+a.h, b2.y+b2.h) - Math.max(a.y, b2.y) + 10);
  // try eight spots around the point; skip ones that cover the flight line, a point or the other card
  function place(w, h, px, py, other){
    const g = 30, C = [[px+g, py-h/2], [px-g-w, py-h/2], [px-w/2, py-g-h], [px-w/2, py+g], [px+g, py-g-h], [px-g-w, py-g-h], [px+g, py+g], [px-g-w, py+g]];
    let best = null;
    for(const [cx, cy] of C){
      const x = clamp(cx, M, r.width-M-w), y = clamp(cy, top, r.height-M-h), R = {x, y, w, h};
      const s = (hitSeg(x, y, w, h) ? 1e6 : 0) + (other ? over(R, other) * 10 : 0) + Math.abs(x-cx) + Math.abs(y-cy);
      if(!best || s < best.s) best = {...R, s};
    }
    return best;
  }
  const gw = W, gh = h1 + gap + h2, G = place(gw, gh, ax, ay, null), L = place(w2, h2, bx, by, G);
  const gx = G.x, gy = G.y, lx = L.x, ly = L.y, lw = w2, lh = h2;
  const strip = `../shots/${D.key}/${sel.k}.webp`;
  const card = (cls, x, y, w, h, n, lab, extra="") => `<div class="card ${cls}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px" data-f="${n}"><span class="fr s${n}" style="background-image:url('${strip}')" role="img" aria-label="${lab}"></span><span class="lab">${lab}</span>${extra}</div>`;
  const vid = !S.video ? "" : sel.video ? `<video class="vid" style="padding:0;width:100%;height:100%;object-fit:contain" src="${sel.video}" controls autoplay muted playsinline></video>` : `<div class="vid">Видео для этой раскидки на странице пока нет.</div>`;
  cards.innerHTML =
    card("aim", gx, gy, W, h1, 1, "КУДА ЦЕЛИТЬСЯ", `<svg class="cross" viewBox="0 0 22 22"><path d="M11 3v6M11 13v6M3 11h6M13 11h6" stroke="#5dff8a" stroke-width="2"/></svg>${vid}<button class="play" data-play title="Видео">${icon(S.video?"x":"play")}</button>`) +
    card("", gx, gy + h1 + gap, w2, h2, 0, "ГДЕ СТОЯТЬ") +
    card("", lx, ly, lw, lh, 2, "КУДА ПАДАЕТ");
  // leader lines from cards to points
  const near = (x, y, w, h, px, py) => [clamp(px, x, x+w), clamp(py, y, y+h)];
  const [c1x,c1y] = near(gx, gy, gw, gh, ax, ay), [c2x,c2y] = near(lx, ly, lw, lh, bx, by);
  links.innerHTML += `<line x1="${c1x}" y1="${c1y}" x2="${ax}" y2="${ay}" stroke="#f0b443" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="${c2x}" y1="${c2y}" x2="${bx}" y2="${by}" stroke="#e7ecef88" stroke-width="1.2" stroke-dasharray="3 3"/>`;
  draw();
}
cards.addEventListener("click", e => {
  if(e.target.closest("[data-play]")){ S.video = !S.video; render(); return; }
  const c = e.target.closest(".card"); if(!c || S.video && c.classList.contains("aim")) return;
  // the aim frame opens as itself; the stand and land frames open as the tall picture with both
  const sel = D.items[S.sel], f = +c.dataset.f;
  const lb = document.createElement("div"); lb.className = "lb";
  lb.innerHTML = f === 1 ? `<span class="fr s1" style="background-image:url('../shots/${D.key}/${sel.k}.webp')"></span>` : `<img src="../shots/${D.key}/${sel.k}_big.webp" alt="">`;
  lb.onclick = () => lb.remove(); document.body.append(lb);
});

// side panel
function panel(sel, list){
  if(sel){
    side.innerHTML = `<div><div class="eyebrow">${KIND[sel.kind]} · ${sel.side.toUpperCase()}</div><h1>${sel.to}</h1><div class="from">с позиции «${sel.from}»</div></div>
      <div class="chips"><span class="chip">${sel.tech}</span><span class="chip"><b>${sel.mouse}</b></span><span class="chip">в воздухе ${sel.air.replace("s"," с")}</span><span class="chip">обычно на ${sel.clock}</span></div>
      ${S.video && innerWidth <= 760 ? (sel.video ? `<video style="width:100%;border-radius:8px;background:#000" src="${sel.video}" controls autoplay muted playsinline></video>` : `<div class="why">Видео для этой раскидки на странице пока нет.</div>`) : ""}
      <div class="photos">${[[1,"КУДА ЦЕЛИТЬСЯ"],[0,"ГДЕ СТОЯТЬ"],[2,"КУДА ПАДАЕТ"]].map(([n,l]) => `<figure><span class="fr s${n}" style="background-image:url('../shots/${D.key}/${sel.k}.webp')"></span><figcaption>${l}</figcaption></figure>`).join("")}</div>
      <div class="acts"><button class="btn main" id="pv">${icon("play")}Видео</button><button class="btn" id="close" title="Закрыть (Esc)">${icon("x")}</button></div>
      <div><h2>${sel.cat}</h2><div class="why">${sel.why}</div></div>
      <div class="note">${sel.n} бросков у профи за 3 месяца, по данным nades.ai.</div>`;
    $("pv").onclick = () => { S.video = !S.video; render(); };
    $("close").onclick = () => { S.sel = S.open = null; S.video = false; render(); };
  } else {
    const cats = {}; list.forEach(it => (cats[it.cat] ||= []).push(it));
    side.innerHTML = `<div><div class="eyebrow">Карта гранат · ${S.side === "all" ? "обе стороны" : S.side.toUpperCase()}</div><h1>${D.name}</h1><div class="from">${list.length} раскидок. Нажмите значок на карте или строку ниже.</div></div>` +
      Object.entries(cats).map(([n, its]) => `<div><h2>${n}</h2><div class="list">${its.map(it => `<button class="row" data-i="${it.i}"><img src="${D.ni[it.kind]}" alt=""><span>${it.to}<small>с позиции «${it.from}»</small></span></button>`).join("")}</div></div>`).join("") +
      `<div class="note">Точки броска и падения, фото и видео — с nades.ai. ${D.lower ? "Переключатель «Верх / Низ» меняет только подложку: у точек нет высоты, поэтому они показаны на обоих уровнях. " : ""}${D.ban ? "Карта забанена в турнире. " : ""}</div>`;
  }
  draw();
}
side.addEventListener("click", e => { const b = e.target.closest(".row"); if(b){ S.sel = +b.dataset.i; S.open = null; S.video = false; render(); } });
side.addEventListener("pointerover", e => { const b = e.target.closest(".row"); marks.querySelectorAll("[data-i]").forEach(g => g.style.filter = b && g.dataset.i === b.dataset.i ? "drop-shadow(0 0 6px #f0b443)" : ""); });

setMap(mapKey()); sideBtns(); kindBtns(); draw();
</script>

</body></html>
