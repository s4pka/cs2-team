<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Команда S4</title>
<link rel="icon" href="data:,">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Oswald:wght@500;600&display=swap">
<style>
/* Layout: icon rail | map that fills the height | quiet side panel. On phones: bar, map, bottom sheet. */
:root{
  --bg:#0e1216; --panel:#151b20; --raise:#1c242b; --line:#29343d; --fg:#e7ecef; --mute:#8b98a2; --accent:#f0b443;
  --smoke:#d7dee3; --flash:#ffe066; --molotov:#ff7b42; --he:#74d47a;
  --display:"Oswald","Arial Narrow",sans-serif; --body:"Golos Text",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:56px 1fr 340px;grid-template-rows:100%}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:14px;border-right:1px solid var(--line);background:var(--panel)}
.logo{font:600 15px var(--display);letter-spacing:.06em;color:var(--accent);margin-bottom:10px}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--mute);position:relative;text-decoration:none}
.ib:hover{background:var(--raise);color:var(--fg)}
.ib[aria-pressed=true]{background:var(--raise);color:var(--fg)}
.ib svg{width:20px;height:20px;stroke-width:1.8}
.tip{position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);white-space:nowrap;background:#000c;padding:4px 8px;border-radius:6px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:30}
.ib:hover .tip,.ib:focus-visible .tip{opacity:1}
.tip.down{left:50%;top:calc(100% + 6px);transform:translateX(-50%)}
.stage{position:relative;overflow:hidden;touch-action:none;cursor:grab;background:radial-gradient(ellipse at 50% 45%,#141a20,var(--bg) 70%)}
.stage.drag{cursor:grabbing}
.stage.flat{background:#0e0f13}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.world img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
.world img.names{position:absolute;inset:0}
#marks,#links{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#links{pointer-events:none}
.bar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none;z-index:10}
.grp{pointer-events:auto;display:flex;gap:2px;padding:3px;background:#151b20e6;border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px)}
.grp .ib{width:34px;height:34px;border-radius:9px}
.grp .ib img{width:16px;height:16px;object-fit:contain;opacity:.45}
.grp .ib[aria-pressed=true] img{opacity:1}
.seg{white-space:nowrap;height:34px;padding:0 10px;border-radius:9px;font:500 13px var(--display);letter-spacing:.06em;color:var(--mute)}
.seg[aria-pressed=true]{background:var(--raise);color:var(--fg)}
.seg:disabled{opacity:.35;cursor:default}
.seg small{font:500 10px var(--display);opacity:.7;margin-left:4px;letter-spacing:.08em}
.zoom{position:absolute;right:12px;bottom:12px;z-index:10;flex-direction:column}
.bar2{display:contents}
.card{position:absolute;z-index:8;border-radius:10px;overflow:hidden;background:#000;border:1px solid #ffffff2e;box-shadow:0 10px 30px #0009;cursor:zoom-in}
.fr{display:block;background-color:#0b0f12;background-repeat:no-repeat;background-size:300% 100%}
.card .fr{position:absolute;inset:0}
.fr.s0{background-position:0 0}.fr.s1{background-position:50% 0}.fr.s2{background-position:100% 0}
.card .lab{position:absolute;left:8px;top:8px;font:500 11px var(--display);letter-spacing:.1em;padding:3px 7px;border-radius:5px;background:#000b}
.card.aim{border-color:var(--accent)}
.card.aim .lab{color:var(--accent)}
.card .play{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;background:#000c;display:grid;place-items:center;cursor:pointer}
.card .play svg{width:16px;height:16px}
.card video.vid{background:#000}
.card .vid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;background:#0b0f12;font-size:13px;color:var(--mute)}
.cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);pointer-events:none}
.side{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:20px 20px 28px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font:500 11px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h1{font:600 26px/1.15 var(--display);letter-spacing:.01em;margin:4px 0 0;text-wrap:balance}
h2{font:500 12px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
.from{color:var(--mute);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 9px;border-radius:7px;background:var(--raise);font-size:13px}
.chip b{font-weight:600}
.why{color:var(--mute);font-size:13px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.ihead{display:flex;align-items:flex-start;gap:8px}.ihead>div:first-child{flex:1;min-width:0}
.icorner{display:flex;gap:2px;margin:-6px -8px 0 0}
.istar{font-size:24px;line-height:1;color:var(--mute)}.istar[aria-pressed=true]{color:var(--accent)}
.binfo{position:absolute;right:12px;width:310px;z-index:12;display:flex;flex-direction:column;gap:12px;padding:14px 16px 16px;background:#151b20f2;border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(6px)}
.binfo h1{font-size:21px}
.btn{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;background:var(--raise);font-weight:500}
.btn.main{background:var(--accent);color:#1a1205}
a.btn{color:var(--fg);text-decoration:none}
.btn svg{width:17px;height:17px}
.list{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;text-align:left;width:100%}
.row:hover,.row.hot{background:var(--raise)}
.row img{width:14px;height:14px;object-fit:contain;flex:none}
.row svg.ki{width:16px;height:16px;flex:none;stroke-width:2.2}
.grp .ib svg.ki{width:19px;height:19px;stroke-width:2.2;opacity:.4}
.grp .ib[aria-pressed=true] svg.ki,.btools .ib svg.ki{opacity:1}
.nh svg.ki{width:20px;height:20px;stroke-width:2.2}
.row span{min-width:0}
.rfav{margin-left:auto;color:var(--accent);font-size:15px;font-weight:400}   /* a favourite, at the end of the row; not shown when only favourites are listed */
.row small{display:block;color:var(--mute);font-size:12px}
.note{font-size:12px;color:var(--mute);border-top:1px solid var(--line);padding-top:14px}
.photos{display:none}
.lb{position:fixed;inset:0;background:#000e;z-index:50;display:grid;place-items:center;padding:24px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.lb .fr{width:min(96vw,1280px);aspect-ratio:16/9;border-radius:8px}
@media (max-width:760px){
  .app{grid-template-columns:100%;grid-template-rows:auto minmax(0,1fr) auto}
  .rail{flex-direction:row;justify-content:center;border-right:0;border-bottom:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
  .logo{margin:0 10px 0 0}
  .tip{display:none}
  .bar{left:8px;right:8px;top:8px}
  #maps{max-width:100%;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
  .bar2{display:flex;gap:8px;flex:1 1 100%;min-width:0;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;pointer-events:auto}
  .bar2>.grp{flex:none}
  .bar2 #bacts{max-width:none;overflow:visible}
  .binfo{left:8px;right:8px;width:auto;padding:10px 12px 12px;gap:8px}.binfo h1{font-size:18px}
  .binfo .photos{grid-template-columns:repeat(3,1fr);gap:6px}.binfo .photos figure:first-child{grid-column:auto}.binfo .photos figcaption{font-size:8px;left:4px;top:4px}
  .side{border-left:0;border-top:1px solid var(--line);max-height:46vh;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .card{display:none}
  .app[data-view=board] .card{display:block}
  .app[data-view=board] .card.howc{display:grid}
  .photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .photos figure{margin:0;position:relative;border-radius:8px;overflow:hidden}
  .photos figure:first-child{grid-column:1/-1}
  .photos .fr{width:100%;aspect-ratio:16/9}
  .photos figcaption{position:absolute;left:6px;top:6px;font:500 10px var(--display);letter-spacing:.1em;background:#000b;padding:2px 6px;border-radius:4px}
}
/* Dragging the map or the board must not select text, drag a picture, or open a menu (long press on phones). */
.app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
img,svg image{-webkit-user-drag:none}
.page .sel,.page pre,.page code,.page td,.page p{-webkit-user-select:text;user-select:text}
/* Sections other than the map: one scrolling page across the map and panel columns */
.page{grid-column:2/4;overflow:auto;background:var(--bg)}
.app:not([data-view=map]):not([data-view=board]) .stage,.app:not([data-view=map]):not([data-view=board]) .side{display:none}
.ph{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px;background:#0e1216ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.ph .grp{backdrop-filter:none;max-width:100%;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
.page{overflow-x:hidden}
.tools .grp{max-width:100%}
.pin{grid-template-columns:minmax(0,1fr)}
.sheet>*{min-width:0}
.keys code,.keys td{overflow-wrap:anywhere}
.pin{max-width:1120px;margin:0 auto;padding:22px 20px 56px;display:grid;gap:18px}
.pin h1{font-size:30px;margin:0}
.pin p{margin:0;max-width:75ch}
.pin a{color:var(--fg);text-underline-offset:3px}
.muted{color:var(--mute);font-size:13px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:12px;min-width:0;scroll-margin-top:70px}
.sheet h2{font:600 18px var(--display);letter-spacing:.02em;text-transform:none;color:var(--fg);margin:0}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 14px}
.head h3{display:flex;align-items:center;gap:10px;font:600 20px var(--display);margin:0}
.head h3 img{width:20px;height:20px;object-fit:contain}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0}
.facts div{min-width:0;background:var(--raise);border-radius:8px;padding:7px 11px}
.facts dt{font-size:12px;color:var(--mute)}
.facts dd{margin:0;font-weight:600}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%;padding:0;cursor:zoom-in;text-align:left}
.strip>span{display:grid;gap:3px;min-width:0}
.strip .fr{aspect-ratio:16/9;border-radius:8px}
.cap{font:500 11px var(--display);letter-spacing:.1em;color:var(--mute)}
.star{font-size:22px;line-height:1;padding:0 4px;color:var(--mute)}
.star[aria-pressed=true]{color:var(--accent)}
.btn.star{font-size:20px;padding:0 12px}
.fst{font-size:18px;line-height:1;color:var(--mute)}
.ib[aria-pressed=true] .fst{color:var(--accent)}
.app[data-view=board] #pracb,.app:not([data-view=map]) #prac{display:none}
.closes{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px}
.closes li{display:flex;align-items:center;gap:7px}
.closes img{width:15px;height:15px;object-fit:contain}
.link{padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-align:left}
.cats .seg{height:auto;min-height:34px;padding:6px 10px;white-space:normal;text-align:left}
.nlist{display:grid;gap:14px}
.zoomable{display:block;width:100%;padding:0;cursor:zoom-in;border-radius:12px;overflow:hidden}
.zoomable img{display:block;width:100%;height:auto}
/* board: drawn on the same stage as the grenade map, in radar pixels, so it pans, zooms and switches maps with it.
   Tool set after the Gamecoach CS board (gamecoach.gg/esports/counter-strike, read 2026-11-08): select and move,
   draw, arrow, rectangle, circle, text, erase; player tokens that turn to show where they look; bomb, dead, grenades;
   slides with Play; space or middle button pans, the wheel zooms. A new step copies the tokens, as KIVO's board does. */
.sw{width:20px;height:20px;border-radius:50%;background:var(--c);border:2px solid #0b0e10;color:#0b0e10;font:700 11px/16px var(--body);text-align:center}
.seg.danger{background:#c62f28;color:#fff}
#bsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#bsvg [data-i]{pointer-events:visiblePainted}
#ink{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.app:not([data-view=map]) #ink,.app:not([data-view=map]) #inktools{display:none!important}
.stage.inking{cursor:crosshair}
/* the board's drawing and its grenade list belong to the board only */
.app:not([data-view=board]) #bsvg,.app:not([data-view=board]) #binfo,.app:not([data-view=board]) #kpick{display:none!important}
.kpick{position:absolute;z-index:16}
.kpick .ib svg.ki{opacity:1}
.bonly{display:none!important}
#objs .bsel{filter:drop-shadow(0 0 2px #f0b443) drop-shadow(0 0 4px #f0b443)}
.ib:disabled{opacity:.35;cursor:default}
.app[data-view=board] .bonly{display:flex!important}
.app[data-view=board] #sides,.app[data-view=board] #kinds,.app[data-view=board] #marks{display:none}
@media (min-width:761px){.app[data-view=board]{grid-template-columns:56px 1fr}}
.app[data-view=board] .side{display:none}
.app[data-view=board] .stage{cursor:crosshair}
.stage.loading #world,.stage.loading #marks,.stage.loading #links,.stage.loading #cards{visibility:hidden}
.app[data-view=board] .stage[data-tool=select]{cursor:default}
.app[data-view=board] .stage[data-tool=erase]{cursor:cell}
.app[data-view=board] .stage.pan,.app[data-view=board] .stage.drag{cursor:grabbing}
.btools{position:absolute;left:12px;top:50%;transform:translateY(-50%);z-index:10;flex-direction:column;align-items:center;max-height:calc(100% - 150px);overflow-y:auto;scrollbar-width:none}
.btools hr{width:24px;border:0;border-top:1px solid var(--line);margin:3px 0}
.seg.tm{min-width:42px;font-variant-numeric:tabular-nums}
.btime{width:58px;height:30px;background:var(--raise);color:var(--fg);border:1px solid var(--accent);border-radius:8px;text-align:center;font:600 13px var(--body)}
.btools .tg{display:flex;flex-direction:column;gap:2px;background:#ffffff0f;border-radius:10px}   /* the grenade tools, one block */
.btools .ib img{width:18px;height:18px;opacity:1}
.btools .ib img.gi,.kpick .ib img{width:24px;height:24px;opacity:1}
.bsteps{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:10;align-items:center}
.bsteps .seg{min-width:34px}
.btext{position:absolute;z-index:12;min-width:120px;background:#0b0f12;color:var(--fg);border:1px solid var(--accent);border-radius:6px;padding:4px 6px;font:600 15px var(--body)}
.bsel{height:34px;max-width:190px;background:var(--raise);color:var(--fg);border:0;border-radius:9px;padding:0 8px;font:500 13px var(--display);letter-spacing:.04em}
.bname{height:34px;width:170px;background:#0b0f12;color:var(--fg);border:1px solid var(--accent);border-radius:9px;padding:0 8px;font:500 14px var(--body);-webkit-user-select:text;user-select:text}
.ib.danger{background:#c62f28;color:#fff}
/* grenade tool: the map's lineups of that kind show where they land; a click puts one on the board */
#pickg [data-pc],#pickg [data-pi],#bsvg [data-tg]{pointer-events:visiblePainted;cursor:pointer}
.toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:20;background:#000d;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600}
/* how to throw */
.how{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:9px;background:var(--raise);color:var(--fg);font:600 13px var(--body);white-space:nowrap}
.how b{font-weight:600}
.how .ms{width:17px;height:24px;flex:none}
.how .hj svg{width:20px;height:20px;stroke-width:2.2;display:block;color:var(--accent)}
.how kbd{font:700 12px/1 var(--body);border:1.5px solid currentColor;border-radius:5px;padding:3px 6px}
.how.big{height:auto;padding:10px 14px;gap:12px;font-size:16px}
.how.big .ms{width:22px;height:30px}
.how.big .hj svg{width:28px;height:28px}
.card.howc{display:grid;place-items:center;background:#0b0f12;cursor:default}
.card.howc .how{background:none}
/* lineups */
.ph .lesson{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;height:42px;padding:0 14px;color:var(--fg);text-decoration:none}
.ph .lesson svg,.nh .seg svg{width:15px;height:15px}
.nc{gap:10px;padding:12px}
.nh{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.nh img{width:20px;height:20px;object-fit:contain}
.nh h3{font:600 19px var(--display);margin:0}
.nh .nfrom{color:var(--mute)}
.nh .sp{flex:1}
.nh .seg{display:flex;align-items:center;gap:6px;background:var(--raise);color:var(--fg);text-decoration:none}
.strip>span{position:relative}
.strip .cap{position:absolute;left:6px;top:6px;background:#000b;color:#fff;padding:2px 6px;border-radius:4px;font-size:10px}
.empty{color:var(--mute);text-align:center;padding:48px 0}
.stage:fullscreen{background:var(--bg)}
@media (max-width:760px){
  #bacts{max-width:100%;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
  .btools{left:8px;right:8px;top:auto;bottom:58px;transform:none;flex-direction:row;flex-wrap:wrap;justify-content:center;max-height:none;overflow:visible}
  .btools hr{display:none}
  .btools{gap:0}
  .btools .tg{flex-direction:row;gap:0}
  .btools .ib{width:32px;height:32px}
  .bsteps{left:8px;transform:none;bottom:8px;max-width:calc(100% - 16px);overflow-x:auto}
  .app[data-view=board] .side{display:none}
  .app[data-view=board] .zoom{display:none}
  #zin,#zout{display:none}
}
/* configs */
.cfg ol,.cfg ul{margin:0;padding-left:1.3em;display:grid;gap:4px}
code{font:500 .92em ui-monospace,Consolas,monospace;background:var(--raise);padding:1px 5px;border-radius:4px}
pre{margin:0;font:500 12.5px/1.5 ui-monospace,Consolas,monospace;background:#0b0f12;border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;max-height:420px}
.keys{border-collapse:collapse}
.keys td{border-bottom:1px solid var(--line);padding:5px 14px 5px 0;vertical-align:top}
.keys td:first-child{font-weight:600;white-space:nowrap}
.keys td code{word-break:break-all}
details>*+*{margin-top:8px}
details summary{cursor:pointer;font-weight:600}
.tw{overflow-x:auto}
.gfx{border-collapse:collapse;width:100%;min-width:640px}
.gfx th{text-align:left;font-weight:500;color:var(--mute);font-size:12px;border-bottom:1px solid var(--line);padding:4px 10px 4px 0}
.gfx td{border-bottom:1px solid var(--line);padding:6px 10px 6px 0;vertical-align:top}
.gfx td:first-child{font-weight:600}
.gfx td:nth-child(2){font-weight:600;color:var(--accent)}
.gfx small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.acts .btn{font-size:13px}
.side .acts .btn{padding:0 11px}
@media (max-width:760px){
  .page{grid-column:1;grid-row:2/4}
  .ph{padding:8px 16px}
  .pin{padding:16px 16px 40px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nc .strip span .cap{font-size:8px;left:3px;top:3px;padding:1px 4px}
  .ph .grp.cats2{flex:1 1 0;min-width:0}
  .nh h3{font-size:17px}
  .nh .sp{display:block;flex-basis:100%;height:0;order:4}
  .nc .how{order:5}
  .nh a.seg{order:6;margin-left:auto}
  .nh .star{order:7}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div class="app" data-view="map">

let downT = null;
stage.addEventListener("pointerdown", e => { downT = e.target; if(e.target.closest(".bar,.zoom,.card,.btools,.bsteps,.btext,.kpick,.binfo")) return; kindClose();
  if(V.view === "map" && INK.on){
    if(INK.cur && e.pointerType === "touch"){ INK.cur = null; inkPaint(); if(INK.last) P.set(INK.pid, INK.last); moved = 99; }   // a second finger: zoom, not draw

  if(INK.cur && e.pointerId === INK.pid){ INK.last = [e.clientX, e.clientY]; const p = pt(e), l = INK.cur.at(-1); if(Math.hypot(p[0]-l[0], p[1]-l[1]) >= 3/(base*S.z)){ INK.cur.push(p); inkPaint(); } return; }

  if(!P.has(e.pointerId)) return; const [px,py] = P.get(e.pointerId); P.set(e.pointerId, [e.clientX, e.clientY]);
  if(P.size === 2){ const [a,b] = [...P.values()]; const d = Math.hypot(a[0]-b[0], a[1]-b[1]); if(pinch){ const r = stage.getBoundingClientRect(); zoomAt(d/pinch, (a[0]+b[0])/2 - r.left, (a[1]+b[1])/2 - r.top); } pinch = d; moved = 99; return; }

});

function clusters(list){ const out = []; for(const it of list){ const e = endOf(it), c = out.find(c => Math.hypot(c.t[0]-e[0], c.t[1]-e[1]) < 9); if(c) c.m.push(it); else out.push({t:e, m:[it]}); } return out; }

function marker(it, x, y, dim, on){

  const list = shown(), cl = clusters(list), sel = S.sel !== null ? D.items[S.sel] : null;

// photo cards beside the throw spot and the landing spot, on the side away from the flight line
function placeCards(sel, avoid){
  cards.innerHTML = ""; cards.sel = sel; if(!sel || innerWidth <= 760 && V.view !== "board") return;
  const r = stage.getBoundingClientRect(), [ax,ay] = scr(sel.t), [bx,by] = scr(sel.l), phone = innerWidth <= 760;
  const W = phone ? r.width*0.62 : Math.min(400, r.width*0.34), w2 = W*0.62, h1 = W*9/16, h2 = w2*9/16, gap = 8, M = V.view === "board" && !phone ? 64 : 12;
  const top = stage.querySelector(".bar").getBoundingClientRect().bottom - r.top + 8;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const hitSeg = (x, y, w, h) => { for(let i = 0; i <= 60; i++){ const px = ax + (bx-ax)*i/60, py = ay + (by-ay)*i/60; if(px > x-10 && px < x+w+10 && py > y-10 && py < y+h+10) return true; } return false; };
  const over = (a, b2) => a && b2 && Math.max(0, Math.min(a.x+a.w, b2.x+b2.w) - Math.max(a.x, b2.x) + 10) * Math.max(0, Math.min(a.y+a.h, b2.y+b2.h) - Math.max(a.y, b2.y) + 10);
  // try eight spots around the point; skip ones that cover the flight line, a point or the other card
  function place(w, h, px, py, others){
    const g = 30, C = [[px+g, py-h/2], [px-g-w, py-h/2], [px-w/2, py-g-h], [px-w/2, py+g], [px+g, py-g-h], [px-g-w, py-g-h], [px+g, py+g], [px-g-w, py+g]];
    let best = null;
    for(const [cx, cy] of C){
      const x = clamp(cx, M, r.width-M-w), y = clamp(cy, top, r.height-M-h), R = {x, y, w, h};
      const s = (hitSeg(x, y, w, h) ? 1e6 : 0) + others.reduce((a, o) => a + over(R, o)*10, 0) + Math.abs(x-cx) + Math.abs(y-cy);
      if(!best || s < best.s) best = {...R, s};
    }
    return best;
  }
  const gw = W, gh = h1 + gap + h2, G = place(gw, gh, ax, ay, [avoid]), L = place(w2, h2, bx, by, [G, avoid]);
  const gx = G.x, gy = G.y, lx = L.x, ly = L.y, lw = w2, lh = h2;
  const strip = `shots/${D.key}/${sel.k}.webp`;
  const card = (cls, x, y, w, h, n, lab, extra="") => `<div class="card ${cls}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px" data-f="${n}"><span class="fr s${n}" style="background-image:url('${strip}')" role="img" aria-label="${lab}"></span><span class="lab">${lab}</span>${extra}</div>`;
  const vid = !S.video ? "" : sel.video ? `<video class="vid" style="padding:0;width:100%;height:100%;object-fit:contain" src="${sel.video}" controls autoplay muted playsinline></video>` : `<div class="vid">Видео нет</div>`;
  cards.innerHTML =
    card("aim", gx, gy, W, h1, 1, "КУДА ЦЕЛИТЬСЯ", `<svg class="cross" viewBox="0 0 22 22"><path d="M11 3v6M11 13v6M3 11h6M13 11h6" stroke="#5dff8a" stroke-width="2"/></svg>${vid}<button class="play" data-play title="Видео">${icon(S.video?"x":"play")}</button>`) +
    card("", gx, gy + h1 + gap, w2, h2, 0, "ГДЕ СТОЯТЬ") +
    `<div class="card howc" style="left:${gx + w2 + gap}px;top:${gy + h1 + gap}px;width:${W - w2 - gap}px;height:${h2}px"><span class="lab">КАК КИДАТЬ</span>${howto(sel, "big")}</div>` +
    card("", lx, ly, lw, lh, 2, "КУДА ПАДАЕТ");
  // leader lines from cards to points
  const near = (x, y, w, h, px, py) => [clamp(px, x, x+w), clamp(py, y, y+h)];
  const [c1x,c1y] = near(gx, gy, gw, gh, ax, ay), [c2x,c2y] = near(lx, ly, lw, lh, bx, by);
  links.innerHTML += `<line x1="${c1x}" y1="${c1y}" x2="${ax}" y2="${ay}" stroke="#f0b443" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="${c2x}" y1="${c2y}" x2="${bx}" y2="${by}" stroke="#e7ecef88" stroke-width="1.2" stroke-dasharray="3 3"/>`;
  draw();
}
cards.addEventListener("click", e => {
  if(e.target.closest("[data-play]")){ S.video = !S.video; if(V.view === "board"){ cards.key = ""; infoCards(); } else render(); return; }
  const c = e.target.closest(".card"); if(!c || c.classList.contains("howc") || S.video && c.classList.contains("aim")) return;

/* practice: the lineups now on the map (side, kinds, favourites) as a cfg, built the way cs2-meta-engine builds its
   practice lists (backend/api/practice_lists.py, build_cfg, 2026-10-03): its practice-server lines, one alias per lineup
   that teleports, aims, gives the grenade and points the next and previous aliases at its neighbours, two keys to cycle.
   The keys are . and , because prac.cfg already binds [ and ]. setpos and setang are nades.ai's own command. */
const GIVE = {smoke:"weapon_smokegrenade", flash:"weapon_flashbang", molotov:"weapon_molotov", he:"weapon_hegrenade"};
const cfgText = t => String(t).replace(/[^A-Za-z0-9 _\-.,!?#+&/]/g, " ").replace(/\/\//g, "/").replace(/\s+/g, " ").trim().slice(0, 48);
function pracCfg(){
  const list = shown().filter(it => it.cmd), n = list.length, name = `nades_${D.key}`;
  const lines = ["// ------------------------------------------------------------------", `// ${D.name} - ${n} lineups`, "//",
    `// 1. Start a local server on the map:  map de_${D.key}`, `// 2. In the console run:  exec ${name}`, "// 3. Press . for the next lineup, , for the previous one.",
    "// ------------------------------------------------------------------", "",
    "sv_cheats 1", "sv_infinite_ammo 1", "ammo_grenade_limit_total 5", "sv_grenade_trajectory_prac_pipreview 1", "mp_roundtime_defuse 60", "mp_freezetime 0", "mp_warmup_end", "bot_kick", ""];
  list.forEach((it, k) => { const i = k+1, nx = i % n + 1, pv = (i - 2 + n) % n + 1;
    lines.push(`alias "nd${i}" "${it.cmd}; give ${GIVE[it.kind]}; echo [${i}/${n}] ${cfgText(it.to + " from " + it.from)}; alias nd_next nd${nx}; alias nd_prev nd${pv}"`); });
  lines.push("", 'bind "." "nd_next"', 'bind "," "nd_prev"', "", `echo Loaded ${n} lineups - press . next, , previous`, "nd1", "");
  return {name, text: lines.join("\n"), n};
}

function saveBoard(){ if(BD.doc){ queueSave(); return; } if(!BD.shared) store(s => s.setItem(BKEY(), JSON.stringify({steps:BD.steps}))); }
const snap = () => JSON.stringify({steps:BD.steps, cur:BD.cur});

// drawing
const smooth = p => { if(p.length < 3) return p.map((q, i) => `${i ? "L" : "M"}${q[0]} ${q[1]}`).join(""); let d = `M${p[0][0]} ${p[0][1]}`; for(let i = 1; i < p.length-1; i++){ const mx = r1((p[i][0]+p[i+1][0])/2), my = r1((p[i][1]+p[i+1][1])/2); d += `Q${p[i][0]} ${p[i][1]} ${mx} ${my}`; } return d + `L${p.at(-1)[0]} ${p.at(-1)[1]}`; };
function simplify(p, tol){
  if(p.length < 3) return p;
  const dist = (q, a, b) => { const dx = b[0]-a[0], dy = b[1]-a[1], l = Math.hypot(dx, dy) || 1; return Math.abs(dy*q[0]-dx*q[1]+b[0]*a[1]-b[1]*a[0])/l; };
  let mx = 0, at = 0; for(let i = 1; i < p.length-1; i++){ const d = dist(p[i], p[0], p.at(-1)); if(d > mx){ mx = d; at = i; } }
  return mx > tol ? simplify(p.slice(0, at+1), tol).slice(0, -1).concat(simplify(p.slice(at), tol)) : [p[0], p.at(-1)];
}
const skull = () => lsvg("skull") || `<path d="M6 6l12 12M18 6L6 18"/>`;
function cone(o, w, c){
  if(o.a === undefined || o.a === null) return "";
  const vp = viewPoly(o);   // with the walls: what he really sees
  if(vp) return `<path d="${vp.map((q, i) => `${i ? "L" : "M"}${r1(q[0]-o.x)} ${r1(q[1]-o.y)}`).join("")}Z" fill="${c}" fill-opacity=".13" stroke="${c}" stroke-opacity=".55" stroke-width="${w*.35}" stroke-linejoin="round" pointer-events="none"/>`;
  const R = w*16, h = 0.5, a = o.a*Math.PI/180, P = t => `${r1(R*Math.cos(t))} ${r1(R*Math.sin(t))}`;
  return `<path d="M0 0L${P(a-h)}A${R} ${R} 0 0 1 ${P(a+h)}Z" fill="${c}" fill-opacity=".22" stroke="${c}" stroke-opacity=".7" stroke-width="${w*.4}" pointer-events="none"/>`;
}
function obj(o, i){
  const w = LW(), k = `data-i="${i}"${i >= 0 && i === BD.sel ? ` class="bsel"` : ""}`;
  if(o.t === "line" || o.t === "arrow"){
    let head = "";
    if(o.t === "arrow" && o.p.length > 1){ const a = o.p.at(-2), b = o.p.at(-1), ang = Math.atan2(b[1]-a[1], b[0]-a[0]), h = w*4.5;
      head = `<polygon points="${b} ${r1(b[0]-h*Math.cos(ang-.45))},${r1(b[1]-h*Math.sin(ang-.45))} ${r1(b[0]-h*Math.cos(ang+.45))},${r1(b[1]-h*Math.sin(ang+.45))}" fill="${o.c}"/>`; }
    const d = smooth(o.p);
    return `<g ${k}><path d="${d}" fill="none" stroke="transparent" stroke-width="${w*5}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${o.c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>${head}</g>`;
  }
  if(o.t === "rect") return `<rect ${k} x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx="${w}" fill="${o.c}" fill-opacity=".14" stroke="${o.c}" stroke-width="${w*.8}"/>`;
  if(o.t === "circ") return `<circle ${k} cx="${o.x}" cy="${o.y}" r="${o.r}" fill="${o.c}" fill-opacity=".14" stroke="${o.c}" stroke-width="${w*.8}"/>`;
  if(o.t === "text") return `<text ${k} x="${o.x}" y="${o.y}" fill="${o.c}" font-size="${w*5.2}" font-weight="600" font-family="Golos Text,system-ui,sans-serif" stroke="#0b0e10" stroke-width="${w*1.3}" paint-order="stroke" dominant-baseline="middle">${esc(o.s)}</text>`;
  const live = turnable(o) && !o.dead;
  const g = (inner, c) => `<g ${k} transform="translate(${o.x} ${o.y})">${live ? cone(o, w, c) : ""}${inner}${live && i >= 0 && i === BD.sel && BD.tool === "select" ? handle(o, i, w) : ""}</g>`;
  const dead = r => { const s = r*1.3/12; return `<circle r="${r}" fill="#0b0e10" stroke="#8b98a2" stroke-width="${w*.7}"/><g transform="translate(${-12*s} ${-12*s}) scale(${s})" fill="none" stroke="#e7ecef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${skull()}</g>`; };   // every dead mark looks the same: white skull, grey ring
  // what a player carries: the bomb as a badge, grenades as a strip under the token (as boltobserv marks the carrier)
  const kit = (r) => (o.c4 ? `<circle cx="${r1(r*.8)}" cy="${r1(-r*.8)}" r="${r1(w*1.9)}" fill="#0b0e10" stroke="#ff5148" stroke-width="${w*.4}"/><image href="${NI.c4}" x="${r1(r*.8-w*1.3)}" y="${r1(-r*.8-w*1.3)}" width="${r1(w*2.6)}" height="${r1(w*2.6)}"/>` : "") + invPill(o.inv, 0, r + w*3.4);
  // with the lineups tool, the player who gets the next lineup wears a white ring
  const who = o.t === "tok" && BD.tool === "pick" && !BD.play && i >= 0 && o.n === Math.min(BD.color, 4)+1 ? `<circle r="${r1(w*5.2)}" fill="none" stroke="#fff" stroke-width="${r1(w*.6)}" stroke-dasharray="${r1(w*1.2)} ${r1(w*.8)}"/>` : "";
  if(o.t === "tok") return g(who + blindRing(blinded(o), w*3.6, w) + (o.dead ? dead(w*3.6) : `<circle r="${w*3.6}" fill="${o.c}" stroke="#0b0e10" stroke-width="${w*.8}"/><text text-anchor="middle" dy=".35em" font-size="${w*4.4}" font-weight="700" font-family="system-ui,sans-serif" fill="#0b0e10">${o.n}</text>`) + kit(w*3.6), o.c);
  if(o.t === "foe") return g(blindRing(blinded(o), w*3.2, w) + (o.dead ? dead(w*3.2) : `<circle r="${w*3.2}" fill="#0b0e10" stroke="#ff5148" stroke-width="${w*1.1}"/><circle r="${w*1.1}" fill="#ff5148"/>`), "#ff5148");
  if(o.t === "c4"){ const r = w*3.6; return g(`<circle r="${r}" fill="#0b0e10" stroke="#ff5148" stroke-width="${w*.8}"/><image href="${NI.c4}" x="${-r*.7}" y="${-r*.7}" width="${r*1.4}" height="${r*1.4}"/>`); }
  if(o.t === "dead") return g(dead(w*3.2));
  if(o.t === "drop") return g(invPill(o.inv, 0, 0));
  if(o.t === "eye"){ const r = w*2.6; return `<g ${k}>${seenLayer(o)}<g transform="translate(${o.x} ${o.y})"><circle r="${r}" fill="#0b0e10" stroke="#f0b443" stroke-width="${w*.6}"/><g transform="translate(${-r*.6} ${-r*.6}) scale(${r*1.2/24})" fill="none" stroke="#f0b443" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${lsvg("eye")}</g></g></g>`; }
  if(o.t === "run") return `<g ${k}>${runLayer(o, w)}</g>`;
  if(o.t === "nade") return `<g ${k}>${blast(o.k, o.x, o.y, o.id)}${count(o.n, o.x + w*3, o.y - w*3)}</g>`;
  if(o.t === "ln"){   // a lineup from the grenade map or a throw by hand: throw spot, flight (through its bounces), and what it covers
    const c = NC[o.k], rt = mk(), open = o.ref && o.id === BD.info, path = bow([[o.tx, o.ty], ...(o.b || []), [o.lx, o.ly]]);
    const hops = (o.b || []).map(q => `<circle cx="${q[0]}" cy="${q[1]}" r="${r1(w*.9)}" fill="#0b0e10" stroke="${c}" stroke-width="${r1(w*.4)}"/>`).join("");
    return `<g ${k}><g opacity=".5"><path d="${path}" fill="none" stroke="#000a" stroke-width="${w*1.4}" stroke-linecap="round" stroke-linejoin="round"/><path d="${path}" fill="none" stroke="${c}" stroke-width="${w*.8}" stroke-dasharray="${w*.2} ${w*1.8}" stroke-linecap="round"/></g>${hops}
      ${blast(o.k, o.lx, o.ly, o.id)}
      ${BD.grouped && BD.grouped.has(i) ? "" : `<g${o.ref ? ` data-ts="1" style="cursor:pointer"` : ""}><circle cx="${o.tx}" cy="${o.ty}" r="${rt}" fill="#0e1216" stroke="${open ? "#f0b443" : c}" stroke-width="${w*(open ? .8 : .5)}"/>${nglyph(o.k, o.tx, o.ty, rt*1.45)}</g>`}${o.by ? byBadge(o, rt, w) : ""}</g>`;
  }
  return "";
}
// who throws it: the player's number in his colour beside the landing
function byBadge(o, rt, w){ const x = r1(o.lx + rt*1.3), y = r1(o.ly - rt*1.3), r = r1(Math.max(w*2, rt*.8));
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${COLORS[o.by-1]}" stroke="#0b0e10" stroke-width="${r1(w*.5)}"/><text x="${x}" y="${y}" dy=".35em" text-anchor="middle" font-size="${r1(r*1.25)}" font-weight="700" font-family="system-ui,sans-serif" fill="#0b0e10">${o.by}</text>`; }
/* a flight bowed sideways by a sine (0 at the ends, most in the middle) to suggest the arc, as cs2d draws grenade paths
   (useGrenadeRendering.ts, drawGrenadePathPreview: amplitude min(4 % of the length, 14 px)); each hop between bounces bows on its own */
function bow(pts){
  const out = [pts[0]], cap = 14/(base || 1);
  for(let j = 1; j < pts.length; j++){ const [ax, ay] = pts[j-1], [bx, by] = pts[j], len = Math.hypot(bx-ax, by-ay) || 1, nx = -(by-ay)/len, ny = (bx-ax)/len, amp = Math.min(len*.04, cap);
    for(let i = 1; i <= 12; i++){ const f = i/12, b = Math.sin(f*Math.PI)*amp; out.push([r1(ax + (bx-ax)*f + nx*b), r1(ay + (by-ay)*f + ny*b)]); } }
  return smooth(out);
}
// throw-spot markers keep about the grenade map's size on screen (its markers are 12 px; these 11 px at least)
const mk = () => Math.max(LW()*2.4, 11/(base*S.z));
// a grenade silhouette (lexogrine/cs2-react-hud src/assets/weapons, commit 7874750) in a colour, as a picture
const gimg = (k, c = KC[k]) => (gimg.m ||= {})[k + c] ||= "data:image/svg+xml," + encodeURIComponent(NI["g_" + k].replace("<svg", `<svg fill="${c}"`));
const count = (n, x, y) => n > 1 ? `<circle cx="${r1(x)}" cy="${r1(y)}" r="${r1(LW()*1.9)}" fill="#f0b443" stroke="#0b0e10" stroke-width="${r1(LW()*.4)}"/><text x="${r1(x)}" y="${r1(y)}" dy=".35em" text-anchor="middle" font-size="${r1(LW()*2.5)}" font-weight="700" font-family="Golos Text,sans-serif" fill="#1a1205">${n}</text>` : "";

      : `<circle cx="${x}" cy="${y}" r="${r}" fill="#0b0e10" stroke="${open ? "#fff" : ring}" stroke-width="${w*(open ? .9 : .6)}"/>${endGlyph(BD.kind, x, y, r*1.15, BD.at)}`) +
      (n === 1 ? tip(g.m[0]) : `<title>${esc(toEnd ? D.items[g.m[0]].to : D.items[g.m[0]].from)}</title>`) + `</g>`;
    if(n > 1) tops += `<g data-pc="${ci}"${fade}><circle cx="${x+r*.85}" cy="${y-r*.85}" r="${w*1.9}" fill="#f0b443" stroke="#0b0e10" stroke-width="${w*.4}"/><text x="${x+r*.85}" y="${y-r*.85}" dy=".35em" text-anchor="middle" font-size="${w*2.5}" font-weight="700" font-family="Golos Text,sans-serif" fill="#1a1205">${n}</text></g>`;
    if(open){   // the group's other ends: one big marker each, where it is on the map
      const rt = r*.9;
      g.m.forEach(i => { const it = D.items[i], [tx, ty] = other(it), onI = isOn(i);
        if(!onI) lines += `<line x1="${tx}" y1="${ty}" x2="${x}" y2="${y}" stroke="#000a" stroke-width="${w*1.4}" stroke-linecap="round"/><line x1="${tx}" y1="${ty}" x2="${x}" y2="${y}" stroke="${c}" stroke-width="${w*.8}" stroke-dasharray="${w*.2} ${w*1.8}" stroke-linecap="round"/>`;
        front += `<g data-pi="${i}"><circle cx="${tx}" cy="${ty}" r="${rt*1.6}" fill="transparent"/><circle cx="${tx}" cy="${ty}" r="${rt}" fill="#0b0e10" stroke="${onI ? "#fff" : c}" stroke-width="${w*(onI ? 1.1 : .7)}"/>` +
          glyph(tx, ty, rt*1.2, c) + tip(i) + `</g>`; });
    }
  });
  return `<g opacity=".6">${lines}</g>` + dots + tops + front;
}
function putLineup(i){
  const it = D.items[i], list = objs(), at = list.findIndex(o => o.t === "ln" && o.ref === it.k);
  if(at >= 0){ push(); list.splice(at, 1); saveBoard(); paint(); boardBars(); return; }
  // the chosen player (1–5, or a click on him) throws it: he goes to its throw spot in this step and faces the landing
  const n = Math.min(BD.color, 4)+1, p = list.find(o => o.t === "tok" && o.n === n && !o.dead), o = {t:"ln", k:it.kind, ref:it.k, id:uid(), tx:it.t[0], ty:it.t[1], lx:it.l[0], ly:it.l[1]};
  push();
  if(p){ o.by = n; p.x = it.t[0]; p.y = it.t[1]; p.a = Math.round(Math.atan2(it.l[1]-it.t[1], it.l[0]-it.t[0])*180/Math.PI); }
  list.push(o); saveBoard(); paint(); boardBars();
}
function pickAt(m){
  if(m.pi !== undefined){ putLineup(m.pi); return; }
  const g = pickClusters()[m.pc]; if(!g) return;
  if(g.m.length === 1){ putLineup(g.m[0]); return; }
  BD.pk.open = BD.pk.open === m.pc ? -1 : m.pc;
  paint();
}
stage.addEventListener("pointerover", e => {

  const g = e.target.closest && e.target.closest("#pickg [data-pc]"), h = g ? +g.dataset.pc : e.target.closest && e.target.closest("#pickg [data-pi]") ? BD.pk.hot : -1;
  if(h !== BD.pk.hot){ BD.pk.hot = h; paint(); }
});
$("btools").addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return;
  if(GT.includes(b.dataset.tool)){ kindPick(b, b.dataset.tool); return; }
  if(b.dataset.cpick !== undefined){ kindPick(b, "color"); return; }   // the six colours open beside the button, like the kinds
  if(b.dataset.spick !== undefined){ kindPick(b, "shape"); return; }   // arrow, rectangle, circle and text, the same way
  kindClose(); if(b.dataset.tool) setTool(b.dataset.tool); if(b.dataset.color) setColor(+b.dataset.color); });
// the grenade kinds, beside the grenade button (above it on phones)
function kindPick(btn, mode){
  const el = $("kpick"); if(!el.hidden && el.dataset.mode === mode){ kindClose(); return; }
  el.dataset.mode = mode;
  el.innerHTML = mode === "shape" ? Object.entries(SHAPE).map(([v, [l, ic]]) => `<button type="button" class="ib" data-shape="${v}" aria-pressed="${BD.tool === v}" title="${l}" aria-label="${l}">${icon(ic)}</button>`).join("") : mode === "color" ? COLORS.map((c, i) => `<button type="button" class="ib" data-color="${i}" aria-pressed="${BD.color === i}" title="Цвет (${i+1})"><span class="sw" style="--c:${c}"></span></button>`).join("") : Object.keys(KIND).map(k => `<button type="button" class="ib" data-kind="${k}" aria-pressed="${BD.tool === mode && BD.kind === k}" title="${KIND[k]}" aria-label="${KIND[k]}">${mode === "drop" ? `<img src="${gimg(k)}" alt="">` : kicon(k)}</button>`).join("");
  el.hidden = false; draw();

  else { el.style.left = `${r.right - s.left + 10}px`; el.style.top = `${r.top - s.top - 3}px`; }
}
function kindClose(){ $("kpick").hidden = true; }
$("kpick").addEventListener("click", e => { const c = e.target.closest("[data-color]"); if(c){ kindClose(); setColor(+c.dataset.color); return; }

  const b = e.target.closest("[data-kind]"); if(!b) return; const mode = $("kpick").dataset.mode; kindClose(); setTool(mode + ":" + b.dataset.kind); });
// a throw by hand while it is being marked: the spot, then the flight to the pointer
function throwGhost(){
  const [x, y] = BD.th, w = LW(), c = KC[BD.kind];
  return BD.thTo && (BD.thB.length || Math.hypot(BD.thTo[0]-x, BD.thTo[1]-y) > w*3) ? obj({t:"ln", k:BD.kind, tx:x, ty:y, lx:BD.thTo[0], ly:BD.thTo[1], b:BD.thB}, -1)

}
const ACT = {nameok:nameDone, namecancel:() => { BD.naming = ""; boardBars(); },
  rename:() => { BD.naming = "rename"; boardBars(); setTimeout(() => $("bname") && $("bname").select(), 0); },

  undo, redo, png:() => exportPng().catch(() => {}), link:() => shareLink().catch(() => {}), keep:keepShared, own:ownBoard,
  full:() => document.fullscreenElement ? document.exitFullscreen() : stage.requestFullscreen().catch(() => {}),

  time:() => { BD.timing = true; boardBars(); setTimeout(() => { const el = $("btime"); if(el){ el.focus(); el.select(); } }, 0); },
  prev:() => goStep(BD.cur-1), next:() => goStep(BD.cur+1), add:addStep, del:delStep, play};
["bacts", "bsteps"].forEach(id => $(id).addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.step) goStep(+b.dataset.step); else if(ACT[b.dataset.act]) ACT[b.dataset.act](); }));
addEventListener("keydown", e => {
  if(V.view !== "board" || e.target.matches("input,textarea,select")) return;
  if(e.code === "Space"){ e.preventDefault(); if(!BD.space){ BD.space = true; stage.classList.add("pan"); } return; }

/* ---------- configs: autoexec.cfg from the owner's file with a few personal choices, graphics as menu values, practice ----------
The base is the owner's own autoexec.cfg (windows/cs2/autoexec.cfg, used in the game). Each choice rewrites only its own
lines of that file; everything else stays as the owner has it. */
const cbLine = (t, re, v) => t.replace(re, m => v === null ? "" : m.replace(/"[^"]*"\s*$/, `"${v}"`));
const cbCut = (t, from, to) => { const a = t.indexOf(from), b = t.indexOf(to, a + 1); return a < 0 || b < 0 ? t : t.slice(0, a) + t.slice(b); };
/* one row per choice: options [value, label] or a number (empty = the game menu decides), the owner's value, and how a value rewrites the file */
const CB = [
 {id:"sens", n:"Чувствительность", t:"num", min:0.05, max:8, step:0.01, base:"0.65",
  apply:(t, v) => cbLine(t, /^sensitivity "[^"]*"\s*$/m, v)},
 {id:"cross", n:"Прицел", o:[["dot","Точка"],[null,"Свой"]], base:"dot",
  apply:(t, v) => v ? t : cbCut(t, "// ---------- Прицел", "// ---------- Клавиши")},
 {id:"jump", n:"Прыжок", o:[["wheel","Колесо мыши"],["space","Пробел"]], base:"wheel",
  apply:(t, v) => v === "wheel" ? t : t.replace(/^\/\/ Прыжок на колесо[^\n]*\nbind "MWHEELUP" "\+jump"\nbind "MWHEELDOWN" "\+jump"\nunbind "SPACE"\n/m, 'bind "SPACE" "+jump"\nbind "MWHEELUP" "invprev"\nbind "MWHEELDOWN" "invnext"\n')},
 {id:"vol", n:"Громкость", t:"num", min:0, max:1, step:0.05, base:"0.65",
  apply:(t, v) => cbLine(t, /^volume "[^"]*"\s*$/m, v)}

const cbKEY = "cs2cfg3";
const cbS = {ov:{}, tier:"mid"};
(() => { const o = store(s => JSON.parse(s.getItem(cbKEY) || "{}"), {});
  if(o.ov && typeof o.ov === "object") for(const r of CB) if(r.id in o.ov) cbS.ov[r.id] = o.ov[r.id];
  if(["weak","mid","strong"].includes(o.tier)) cbS.tier = o.tier; })();

  let t = L.cfg.own.replace(/\r\n/g, "\n");

  return `<div class="cb-it"><span class="cb-n">${r.n}</span><div class="cb-c">${ctl}<button type="button" class="ib cb-rs" data-cbr="${r.id}" title="Как в основе" ${chg ? "" : "hidden"}>${icon("rotate-ccw")}</button></div></div>`;
