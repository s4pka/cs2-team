<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Команда S4</title>
<link rel="icon" href="data:,">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Oswald:wght@500;600&display=swap">
<style>
/* Layout: icon rail | map that fills the height | quiet side panel. On phones: bar, map, bottom sheet. */
:root{
  --bg:#0e1216; --panel:#151b20; --raise:#1c242b; --line:#29343d; --fg:#e7ecef; --mute:#8b98a2; --accent:#f0b443;
  --smoke:#d7dee3; --flash:#ffe066; --molotov:#ff7b42; --he:#74d47a;
  --display:"Oswald","Arial Narrow",sans-serif; --body:"Golos Text",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:56px 1fr 340px;grid-template-rows:100%}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:14px;border-right:1px solid var(--line);background:var(--panel)}
.logo{font:600 15px var(--display);letter-spacing:.06em;color:var(--accent);margin-bottom:10px}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--mute);position:relative;text-decoration:none}
.ib:hover{background:var(--raise);color:var(--fg)}
.ib[aria-pressed=true]{background:var(--raise);color:var(--fg)}
.ib svg{width:20px;height:20px;stroke-width:1.8}
.tip{position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);white-space:nowrap;background:#000c;padding:4px 8px;border-radius:6px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:30}
.ib:hover .tip,.ib:focus-visible .tip{opacity:1}
.tip.down{left:50%;top:calc(100% + 6px);transform:translateX(-50%)}
.stage{position:relative;overflow:hidden;touch-action:none;cursor:grab;background:radial-gradient(ellipse at 50% 45%,#141a20,var(--bg) 70%)}
.stage.drag{cursor:grabbing}
.stage.flat{background:#0e0f13}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.world img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
.world img.names{position:absolute;inset:0}
#marks,#links{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#links{pointer-events:none}
.bar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none;z-index:10}
.grp{pointer-events:auto;display:flex;gap:2px;padding:3px;background:#151b20e6;border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px)}
.grp .ib{width:34px;height:34px;border-radius:9px}
.grp .ib img{width:16px;height:16px;object-fit:contain;opacity:.45}
.grp .ib[aria-pressed=true] img{opacity:1}
.seg{white-space:nowrap;height:34px;padding:0 10px;border-radius:9px;font:500 13px var(--display);letter-spacing:.06em;color:var(--mute)}
.seg[aria-pressed=true]{background:var(--raise);color:var(--fg)}
.seg:disabled{opacity:.35;cursor:default}
.seg small{font:500 10px var(--display);opacity:.7;margin-left:4px;letter-spacing:.08em}
.zoom{position:absolute;right:12px;bottom:12px;z-index:10;flex-direction:column}
.card{position:absolute;z-index:8;border-radius:10px;overflow:hidden;background:#000;border:1px solid #ffffff2e;box-shadow:0 10px 30px #0009;cursor:zoom-in}
.fr{display:block;background-color:#0b0f12;background-repeat:no-repeat;background-size:300% 100%}
.card .fr{position:absolute;inset:0}
.fr.s0{background-position:0 0}.fr.s1{background-position:50% 0}.fr.s2{background-position:100% 0}
.card .lab{position:absolute;left:8px;top:8px;font:500 11px var(--display);letter-spacing:.1em;padding:3px 7px;border-radius:5px;background:#000b}
.card.aim{border-color:var(--accent)}
.card.aim .lab{color:var(--accent)}
.card .play{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;background:#000c;display:grid;place-items:center;cursor:pointer}
.card .play svg{width:16px;height:16px}
.card video.vid{background:#000}
.card .vid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;background:#0b0f12;font-size:13px;color:var(--mute)}
.cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);pointer-events:none}
.side{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:20px 20px 28px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font:500 11px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h1{font:600 26px/1.15 var(--display);letter-spacing:.01em;margin:4px 0 0;text-wrap:balance}
h2{font:500 12px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
.from{color:var(--mute);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 9px;border-radius:7px;background:var(--raise);font-size:13px}
.chip b{font-weight:600}
.why{color:var(--mute);font-size:13px}
.acts{display:flex;gap:8px}
.btn{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;background:var(--raise);font-weight:500}
.btn.main{background:var(--accent);color:#1a1205}
.btn svg{width:17px;height:17px}
.list{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;text-align:left;width:100%}
.row:hover,.row.hot{background:var(--raise)}
.row img{width:14px;height:14px;object-fit:contain;flex:none}
.row span{min-width:0}
.row small{display:block;color:var(--mute);font-size:12px}
.note{font-size:12px;color:var(--mute);border-top:1px solid var(--line);padding-top:14px}
.photos{display:none}
.lb{position:fixed;inset:0;background:#000e;z-index:50;display:grid;place-items:center;padding:24px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.lb .fr{width:min(96vw,1280px);aspect-ratio:16/9;border-radius:8px}
@media (max-width:760px){
  .app{grid-template-columns:100%;grid-template-rows:auto minmax(0,1fr) auto}
  .rail{flex-direction:row;justify-content:center;border-right:0;border-bottom:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
  .logo{margin:0 10px 0 0}
  .tip{display:none}
  .bar{left:8px;right:8px;top:8px}
  #maps{max-width:100%;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
  .side{border-left:0;border-top:1px solid var(--line);max-height:46vh;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .card{display:none}
  .photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .photos figure{margin:0;position:relative;border-radius:8px;overflow:hidden}
  .photos figure:first-child{grid-column:1/-1}
  .photos .fr{width:100%;aspect-ratio:16/9}
  .photos figcaption{position:absolute;left:6px;top:6px;font:500 10px var(--display);letter-spacing:.1em;background:#000b;padding:2px 6px;border-radius:4px}
}
/* Dragging the map or the board must not select text, drag a picture, or open a menu (long press on phones). */
.app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
img,svg image{-webkit-user-drag:none}
.page .sel,.page pre,.page code,.page td,.page p{-webkit-user-select:text;user-select:text}
/* Sections other than the map: one scrolling page across the map and panel columns */
.page{grid-column:2/4;overflow:auto;background:var(--bg)}
.app:not([data-view=map]):not([data-view=board]) .stage,.app:not([data-view=map]):not([data-view=board]) .side{display:none}
.ph{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px;background:#0e1216ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.ph .grp{backdrop-filter:none;max-width:100%;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
.page{overflow-x:hidden}
.tools .grp{max-width:100%}
.pin{grid-template-columns:minmax(0,1fr)}
.sheet>*{min-width:0}
.keys code,.keys td{overflow-wrap:anywhere}
.pin{max-width:1120px;margin:0 auto;padding:22px 20px 56px;display:grid;gap:18px}
.pin h1{font-size:30px;margin:0}
.pin p{margin:0;max-width:75ch}
.pin a{color:var(--fg);text-underline-offset:3px}
.muted{color:var(--mute);font-size:13px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:12px;min-width:0;scroll-margin-top:70px}
.sheet h2{font:600 18px var(--display);letter-spacing:.02em;text-transform:none;color:var(--fg);margin:0}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 14px}
.head h3{display:flex;align-items:center;gap:10px;font:600 20px var(--display);margin:0}
.head h3 img{width:20px;height:20px;object-fit:contain}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0}
.facts div{min-width:0;background:var(--raise);border-radius:8px;padding:7px 11px}
.facts dt{font-size:12px;color:var(--mute)}
.facts dd{margin:0;font-weight:600}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%;padding:0;cursor:zoom-in;text-align:left}
.strip>span{display:grid;gap:3px;min-width:0}
.strip .fr{aspect-ratio:16/9;border-radius:8px}
.cap{font:500 11px var(--display);letter-spacing:.1em;color:var(--mute)}
.star{font-size:22px;line-height:1;padding:0 4px;color:var(--mute)}
.star[aria-pressed=true]{color:var(--accent)}
.btn.star{font-size:20px;padding:0 12px}
.fst{font-size:18px;line-height:1;color:var(--mute)}
.ib[aria-pressed=true] .fst{color:var(--accent)}
.app[data-view=board] #favs{display:none}
.closes{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px}
.closes li{display:flex;align-items:center;gap:7px}
.closes img{width:15px;height:15px;object-fit:contain}
.link{padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-align:left}
.cats .seg{height:auto;min-height:34px;padding:6px 10px;white-space:normal;text-align:left}
.nlist{display:grid;gap:14px}
.zoomable{display:block;width:100%;padding:0;cursor:zoom-in;border-radius:12px;overflow:hidden}
.zoomable img{display:block;width:100%;height:auto}
/* board: drawn on the same stage as the grenade map, in radar pixels, so it pans, zooms and switches maps with it.
   Tool set after the Gamecoach CS board (gamecoach.gg/esports/counter-strike, read 2026-11-08): select and move,
   draw, arrow, rectangle, circle, text, erase; player tokens that turn to show where they look; bomb, dead, grenades;
   slides with Play; space or middle button pans, the wheel zooms. A new step copies the tokens, as KIVO's board does. */
.sw{width:20px;height:20px;border-radius:50%;background:var(--c);border:2px solid #0b0e10;color:#0b0e10;font:700 11px/16px var(--body);text-align:center}
.seg.danger{background:#c62f28;color:#fff}
#bsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#bsvg [data-i]{pointer-events:visiblePainted}
#ink{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.app:not([data-view=map]) #ink,.app:not([data-view=map]) #inktools{display:none!important}
.stage.inking{cursor:crosshair}
/* the board's drawing and its grenade list belong to the board only */
.app:not([data-view=board]) #bsvg,.app:not([data-view=board]) #npick,.app:not([data-view=board]) #toast{display:none!important}
.bonly{display:none!important}
#objs .bsel{filter:drop-shadow(0 0 2px #f0b443) drop-shadow(0 0 4px #f0b443)}
.ib:disabled{opacity:.35;cursor:default}
.app[data-view=board] .bonly{display:flex!important}
.app[data-view=board] #sides,.app[data-view=board] #kinds,.app[data-view=board] #marks,.app[data-view=board] #links,.app[data-view=board] #cards{display:none}
@media (min-width:761px){.app[data-view=board]{grid-template-columns:56px 1fr}}
.app[data-view=board] .side{display:none}
.app[data-view=board] .stage{cursor:crosshair}
.app[data-view=board] .stage[data-tool=select]{cursor:default}
.app[data-view=board] .stage[data-tool=erase]{cursor:cell}
.app[data-view=board] .stage.pan,.app[data-view=board] .stage.drag{cursor:grabbing}
.btools{position:absolute;left:12px;top:50%;transform:translateY(-50%);z-index:10;flex-direction:column;align-items:center;max-height:calc(100% - 150px);overflow-y:auto;scrollbar-width:none}
.btools hr{width:24px;border:0;border-top:1px solid var(--line);margin:3px 0}
.btools .ib img{width:18px;height:18px;opacity:1}
.bsteps{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:10;align-items:center}
.bsteps .seg{min-width:34px}
.btext{position:absolute;z-index:12;min-width:120px;background:#0b0f12;color:var(--fg);border:1px solid var(--accent);border-radius:6px;padding:4px 6px;font:600 15px var(--body)}
.bsel{height:34px;max-width:190px;background:var(--raise);color:var(--fg);border:0;border-radius:9px;padding:0 8px;font:500 13px var(--display);letter-spacing:.04em}
.bname{height:34px;width:170px;background:#0b0f12;color:var(--fg);border:1px solid var(--accent);border-radius:9px;padding:0 8px;font:500 14px var(--body);-webkit-user-select:text;user-select:text}
.ib.danger{background:#c62f28;color:#fff}
.npick{position:absolute;left:64px;top:80px;z-index:15;width:290px;max-height:min(70%,520px);display:flex;flex-direction:column;gap:4px;padding:8px;background:#151b20f2;border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px)}
.npick .nphead{display:flex;align-items:center;gap:8px;padding:2px 2px 6px}
.npick .nphead img{width:18px;height:18px;object-fit:contain}
.npick .nphead .sp{flex:1}
.npick .nplist{overflow:auto;display:flex;flex-direction:column;gap:2px}
.npick .row svg{width:16px;height:16px;flex:none}
@media (max-width:760px){.npick{left:8px;right:8px;width:auto;top:auto;bottom:112px;max-height:50%}}
.toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:20;background:#000d;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600}
/* how to throw */
.how{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:9px;background:var(--raise);color:var(--fg);font:600 13px var(--body);white-space:nowrap}
.how b{font-weight:600}
.how .ms{width:17px;height:24px;flex:none}
.how .hj svg{width:20px;height:20px;stroke-width:2.2;display:block;color:var(--accent)}
.how kbd{font:700 12px/1 var(--body);border:1.5px solid currentColor;border-radius:5px;padding:3px 6px}
.how.big{height:auto;padding:10px 14px;gap:12px;font-size:16px}
.how.big .ms{width:22px;height:30px}
.how.big .hj svg{width:28px;height:28px}
.card.howc{display:grid;place-items:center;background:#0b0f12;cursor:default}
.card.howc .how{background:none}
/* lineups */
.ph .lesson{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;height:42px;padding:0 14px;color:var(--fg);text-decoration:none}
.ph .lesson svg,.nh .seg svg{width:15px;height:15px}
.nc{gap:10px;padding:12px}
.nh{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.nh img{width:20px;height:20px;object-fit:contain}
.nh h3{font:600 19px var(--display);margin:0}
.nh .nfrom{color:var(--mute)}
.nh .sp{flex:1}
.nh .seg{display:flex;align-items:center;gap:6px;background:var(--raise);color:var(--fg);text-decoration:none}
.strip>span{position:relative}
.strip .cap{position:absolute;left:6px;top:6px;background:#000b;color:#fff;padding:2px 6px;border-radius:4px;font-size:10px}
.empty{color:var(--mute);text-align:center;padding:48px 0}
.stage:fullscreen{background:var(--bg)}
@media (max-width:760px){
  .btools{left:8px;right:8px;top:auto;bottom:58px;transform:none;flex-direction:row;max-height:none;overflow-x:auto;overflow-y:hidden;touch-action:pan-x}
  .btools hr{width:0;height:24px;border-top:0;border-left:1px solid var(--line);margin:0 3px}
  .bsteps{left:8px;transform:none;bottom:8px;max-width:calc(100% - 16px);overflow-x:auto}
  .app[data-view=board] .side{display:none}
  .app[data-view=board] .zoom{display:none}
}
/* configs */
.cfg ol,.cfg ul{margin:0;padding-left:1.3em;display:grid;gap:4px}
code{font:500 .92em ui-monospace,Consolas,monospace;background:var(--raise);padding:1px 5px;border-radius:4px}
pre{margin:0;font:500 12.5px/1.5 ui-monospace,Consolas,monospace;background:#0b0f12;border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;max-height:420px}
.keys{border-collapse:collapse}
.keys td{border-bottom:1px solid var(--line);padding:5px 14px 5px 0;vertical-align:top}
.keys td:first-child{font-weight:600;white-space:nowrap}
.keys td code{word-break:break-all}
details>*+*{margin-top:8px}
details summary{cursor:pointer;font-weight:600}
.tw{overflow-x:auto}
.gfx{border-collapse:collapse;width:100%;min-width:640px}
.gfx th{text-align:left;font-weight:500;color:var(--mute);font-size:12px;border-bottom:1px solid var(--line);padding:4px 10px 4px 0}
.gfx td{border-bottom:1px solid var(--line);padding:6px 10px 6px 0;vertical-align:top}
.gfx td:first-child{font-weight:600}
.gfx td:nth-child(2){font-weight:600;color:var(--accent)}
.gfx small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.acts .btn{font-size:13px}
@media (max-width:760px){
  .page{grid-column:1;grid-row:2/4}
  .ph{padding:8px 16px}
  .pin{padding:16px 16px 40px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nc .strip span .cap{font-size:8px;left:3px;top:3px;padding:1px 4px}
  .ph .grp.cats2{flex:1 1 0;min-width:0}
  .nh h3{font-size:17px}
  .nh .sp{display:none}
  .nc .how{order:5}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div class="app" data-view="map">
  <nav class="rail" aria-label="Разделы" id="rail">
    <div class="logo">S4</div>
    <button class="ib" data-view="map"><i data-lucide="map"></i><span class="tip">Карта гранат</span></button>
    <button class="ib" data-view="board"><i data-lucide="pencil-ruler"></i><span class="tip">Доска</span></button>
    <button class="ib" data-view="cfg"><i data-lucide="sliders-horizontal"></i><span class="tip">Конфиги</span></button>
    <button class="ib" data-view="nades"><i data-lucide="layout-list"></i><span class="tip">Раскидки</span></button>
  </nav>

  <main class="stage" id="stage">
    <div class="world" id="world">
      <img id="radar" alt="Радар">
      <img id="names" class="names" alt="Названия позиций" hidden>
      <svg id="ink" preserveAspectRatio="none" aria-hidden="true"><g id="inkg"></g></svg>
      <svg id="bsvg" preserveAspectRatio="none" aria-label="Доска"><defs id="bdefs"></defs><g id="objs"></g></svg>
    </div>
    <svg id="links"></svg>
    <svg id="marks"></svg>
    <div class="bar">
      <div class="grp" id="maps"></div>
      <div class="grp" id="inktools"><button class="ib" id="inkpen" aria-pressed="false" title="Карандаш"><i data-lucide="pencil"></i></button><button class="ib" id="inkclear" title="Стереть всё"><i data-lucide="eraser"></i></button></div>
      <div class="grp" id="favs"></div>
      <div class="grp" id="sides"></div>
      <div class="grp" id="kinds"></div>
      <div class="grp" id="tools">
        <button class="ib" id="layer" aria-pressed="false"><i data-lucide="tag"></i><span class="tip down">Названия позиций</span></button>
      </div>
      <div class="grp" id="levels" hidden></div>
      <div class="grp bonly" id="bacts"></div>
    </div>
    <div class="grp btools bonly" id="btools"></div>
    <div class="grp bsteps bonly" id="bsteps"></div>
    <div class="grp zoom">
      <button class="ib" id="zin"><i data-lucide="plus"></i></button>
      <button class="ib" id="zout"><i data-lucide="minus"></i></button>
      <button class="ib" id="zfit"><i data-lucide="scan"></i></button>
    </div>
    <div id="cards"></div>
  </main>

  <aside class="side" id="side"></aside>

egrenade\"\nbind \"7\" \"give weapon_flashbang\"\nbind \"8\" \"give weapon_molotov\"\nbind \"9\" \"give weapon_hegrenade\"\nbind \"0\" \"ent_fire smokegrenade_projectile kill; ent_fire inferno kill\"\nbind \"[\" \"bot_add_t\"\nbind \"]\" \"bot_place\"\nunbind \"F1\"\nunbind \"F2\"\nunbind \"UPARROW\"\n\n// ---------- Игра и интерфейс ----------\ncl_autohelp \"0\"\ncl_showloadout \"1\"\ncl_use_opens_buy_menu \"0\"\ncl_hide_avatar_images \"0\"\ncl_silencer_mode \"0\"\nhud_showtargetid \"0\"\ncl_teamid_overhead_mode \"3\"\nr_drawtracers_firstperson \"1\"\nr_fullscreen_gamma \"2.0\"\n// Эффект попадания - только после подтверждения сервера\ncl_predict_body_shot_fx \"0\"\ncl_predict_head_shot_fx \"0\"\ncl_predict_kill_ragdolls \"0\"\nhud_scaling \"1\"\nsafezonex \"1\"\ncl_hud_color \"1\"\nengine_no_focus_sleep \"0\"\n\n// Вьюмодель как у большинства про: 68 / 2.5 / 0 / -1.5. Пресет первым: после смещений он может их сбросить.\nviewmodel_presetpos \"3\"\nviewmodel_fov \"68\"\nviewmodel_offset_x \"2.5\"\nviewmodel_offset_y \"0\"\nviewmodel_offset_z \"-1.5\"\n\n// Радар\ncl_hud_radar_scale \"1.1\"\ncl_radar_scale \"0.65\"\ncl_radar_always_centered \"1\"\ncl_radar_rotate \"1\"\ncl_radar_icon_scale_min \"0.5\"\n\n// ---------- Кадры и сеть ----------\n// Без потолка кадров. V-Sync выключен, Reflex включён - в настройках видео.\nfps_max \"0\"\n// Игроки заметнее на тёмном фоне\nr_player_visibility_mode \"1\"\n// Максимум трафика, без буфера: буфер нужен только при потерях пакетов\nrate \"786432\"\ncl_net_buffer_ticks \"0\"\n// Пинг и потери пакетов на экране - только когда они плохие\ncl_hud_telemetry_ping_show \"1\"\ncl_hud_telemetry_net_misdelivery_show \"1\"\ncl_hud_telemetry_frametime_show \"0\"\ncl_showfps \"0\"\n\n// ---------- Звук ----------\n// Эквалайзер: 0 Natural, 1 Crisp, 2 Smooth. Изоляция Л/П: 0 точно, 1 жёстко. Коррекция перспективы: 1 по полю зрения.\nvolume \"0.65\"\nsnd_mute_losefocus \"0\"\nsnd_headphone_eq \"0\"\nsnd_spatialize_lerp \"0.5\"\nsnd_steamaudio // view: fit, pan, zoom
let base = 1;
// the toolbar floats over the stage; the map is fitted below it when it wraps (phones) or would be covered by it (D.ct: first row of playable area)
function fit(){
  const r = stage.getBoundingClientRect(), bar = stage.querySelector(".bar").getBoundingClientRect(), under = bar.bottom - r.top + 4;
  const b0 = Math.min(r.width / D.w, (r.height - 8) / D.h), covered = (r.height - D.h*b0)/2 + 4 + D.ct*b0 < under;
  const top = innerWidth <= 760 || bar.height > 60 || covered ? under : 0, H = r.height - top;
  base = Math.min(r.width / D.w, (H - 8) / D.h); S.z = 1; S.x = (r.width - D.w*base)/2; S.y = top + (H - D.h*base)/2 + 4; apply();
}
function apply(){
  // keep at least 120 px of the map on screen, so a drag never throws it away
  const r = stage.getBoundingClientRect(), W = D.w*base*S.z, H = D.h*base*S.z, k = 120;
  if(r.width){ S.x = Math.min(r.width - k, Math.max(k - W, S.x)); S.y = Math.min(r.height - k, Math.max(k - H, S.y)); }
  world.style.width = D.w*base+"px"; world.style.height = D.h*base+"px"; world.style.transform = `translate(${S.x}px,${S.y}px) scale(${S.z})`; if(V.view === "map") render(); }
const scr = ([x,y]) => [S.x + x*base*S.z, S.y + y*base*S.z];
function zoomAt(f, cx, cy){ const z = Math.min(6, Math.max(1, S.z*f)); f = z/S.z; S.x = cx - (cx - S.x)*f; S.y = cy - (cy - S.y)*f; S.z = z; apply(); }
stage.addEventListener("wheel", e => { e.preventDefault(); const r = stage.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX - r.left, e.clientY - r.top); }, {passive:false});
const P = new Map(); let moved = 0, pinch = 0;
let downT = null;
stage.addEventListener("pointerdown", e => { downT = e.target; if(e.target.closest(".bar,.zoom,.card,.btools,.bsteps,.btext")) return;
  if(V.view === "map" && INK.on){
    if(INK.cur && e.pointerType === "touch"){ INK.cur = null; inkPaint(); if(INK.last) P.set(INK.pid, INK.last); moved = 99; }   // a second finger: zoom, not draw
    else if(e.button === 0){ INK.cur = [pt(e)]; INK.pid = e.pointerId; INK.last = [e.clientX, e.clientY]; try { stage.setPointerCapture(e.pointerId); } catch(_){} return; }
  }
  if(V.view === "board" && !boardDown(e)) return;
  P.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; (() => { try { stage.setPointerCapture(e.pointerId); } catch(_){} })(); });
stage.addEventListener("pointermove", e => {
  if(INK.cur && e.pointerId === INK.pid){ INK.last = [e.clientX, e.clientY]; const p = pt(e), l = INK.cur.at(-1); if(Math.hypot(p[0]-l[0], p[1]-l[1]) >= 3/(base*S.z)){ INK.cur.push(p); inkPaint(); } return; }
  if(V.view === "board" && BD.drag){ boardMove(e); return; }
  if(!P.has(e.pointerId)) return; const [px,py] = P.get(e.pointerId); P.set(e.pointerId, [e.clientX, e.clientY]);
  if(P.size === 2){ const [a,b] = [...P.values()]; const d = Math.hypot(a[0]-b[0], a[1]-b[1]); if(pinch){ const r = stage.getBoundingClientRect(); zoomAt(d/pinch, (a[0]+b[0])/2 - r.left, (a[1]+b[1])/2 - r.top); } pinch = d; moved = 99; return; }
  moved += Math.abs(e.clientX-px) + Math.abs(e.clientY-py); if(moved > 4){ stage.classList.add("drag"); S.x += e.clientX-px; S.y += e.clientY-py; apply(); }
});
const end = e => { P.delete(e.pointerId); pinch = 0; stage.classList.remove("drag"); };
stage.addEventListener("pointerup", e => {
  if(INK.cur && e.pointerId === INK.pid){ if(INK.cur.length > 1) INK.lines.push(simplify(INK.cur, D.w/660)); INK.cur = null; inkPaint(); return; }
  if(V.view === "board"){ if(BD.drag) boardUp(); else if(moved <= 4 && BD.tool === "select" && !e.target.closest("[data-i],.bar,.zoom,.btools,.bsteps")) { BD.sel = -1; paint(); } end(e); return; }
  const wasDrag = moved > 4; end(e); if(wasDrag) return; const t = downT && downT.closest("[data-i],[data-c]"); if(t) pick(t); else if(!(downT && downT.closest(".bar,.zoom,.card"))){ S.sel = S.open = null; S.video = false; render(); } });
stage.addEventListener("pointercancel", e => { if(BD.drag){ BD.drag = null; paint(); } end(e); });
$("zin").onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(1.4, r.width/2, r.height/2); };
$("zout").onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(1/1.4, r.width/2, r.height/2); };
$("zfit").onclick = fit;
addEventListener("resize", () => { if(V.view === "map" || V.view === "board") fit(); });
addEventListener("keydown", e => { if(e.key === "Escape" && V.view === "map"){ S.sel = S.open = null; S.video = false; render(); } });

// data views
const shown = () => D.items.map((it,i) => ({...it, i})).filter(it => (S.side === "all" || it.side === S.side) && S.kinds.has(it.kind) && (!S.only || FAV.ids.has(it.slug)));
function clusters(list){ const out = []; for(const it of list){ const c = out.find(c => Math.hypot(c.t[0]-it.t[0], c.t[1]-it.t[1]) < 9); if(c) c.m.push(it); else out.push({t:it.t, m:[it]}); } return out; }
function pick(el){
  if(el.dataset.c !== undefined){ const c = +el.dataset.c; S.open = S.open === c ? null : c; S.sel = null; S.video = false; }
  else { S.sel = +el.dataset.i; S.video = false; }
  render();
}
function marker(it, x, y, dim, on){
  const c = col(it.kind), r = on ? 15 : 12;
  return `<g data-i="${it.i}" style="cursor:pointer;opacity:${dim?.28:1}"><circle cx="${x}" cy="${y}" r="${r+6}" fill="transparent"/>
    <circle cx="${x}" cy="${y}" r="${r}" fill="#0e1216" stroke="${c}" stroke-width="${on?3:2}"/>
    <image href="${D.ni[it.kind]}" x="${x-r*.55}" y="${y-r*.62}" width="${r*1.1}" height="${r*1.24}"/></g>`;
}
function render(){
  const list = shown(), cl = clusters(list), sel = S.sel !== null ? D.items[S.sel] : null;
  let m = "", l = "";
  cl.forEach((c, ci) => {
    const [x,y] = scr(c.t), inSel = sel && c.m.some(it => it.i === S.sel), dim = (S.open !== null && S.open !== ci) || (sel && !inSel);
    if(c.m.length === 1){ m += marker(c.m[0], x, y, dim, inSel); return; }
    if(S.open === ci || inSel){
      const n = c.m.length, R = 30 + n*2;
      m += `<circle cx="${x}" cy="${y}" r="5" fill="#e7ecef"/>`;
      c.m.forEach((it, k) => { const a = -Math.PI/2 + k*2*Math.PI/n, px = x + R*Math.cos(a), py = y + R*Math.sin(a);
        m += `<line x1="${x}" y1="${y}" x2="${px}" y2="${py}" stroke="#e7ecef55" stroke-width="1.5"/>` + marker(it, px, py, sel && it.i !== S.sel, it.i === S.sel); });
      return;
    }
    const kinds = [...new Set(c.m.map(it => it.kind))];
    m += `<g data-c="${ci}" style="cursor:pointer;opacity:${dim?.28:1}"><circle cx="${x}" cy="${y}" r="20" fill="transparent"/>
      <circle cx="${x}" cy="${y}" r="13" fill="#0e1216" stroke="#e7ecef" stroke-width="2"/>
      <image href="${D.ni[kinds[0]]}" x="${x-7}" y="${y-8}" width="14" height="16"/>
      <circle cx="${x+11}" cy="${y-11}" r="8.5" fill="#f0b443"/><text x="${x+11}" y="${y-7.5}" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1205" font-family="Golos Text,sans-serif">${c.m.length}</text></g>`;
  });
  if(sel){
    const [ax,ay] = scr(sel.t), [bx,by] = scr(sel.l), c = col(sel.kind), ang = Math.atan2(by-ay, bx-ax);
    l += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="#000a" stroke-width="5" stroke-linecap="round"/>
      <line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${c}" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round"/>
      <circle cx="${bx}" cy="${by}" r="18" fill="${c}" fill-opacity=".22" stroke="${c}" stroke-width="2"/>
      <path d="M${bx-9*Math.cos(ang)-5*Math.sin(ang)},${by-9*Math.sin(ang)+5*Math.cos(ang)} L${bx},${by} L${bx-9*Math.cos(ang)+5*Math.sin(ang)},${by-9*Math.sin(ang)-5*Math.cos(ang)}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round"/>`;
  }
  marks.innerHTML = m; links.innerHTML = l; placeCards(sel); panel(sel, list);
}

// photo cards beside the throw spot and the landing spot, on the side away from the flight line
function placeCards(sel){
  cards.innerHTML = ""; if(!sel || innerWidth <= 760) return;
  const r = stage.getBoundingClientRect(), [ax,ay] = scr(sel.t), [bx,by] = scr(sel.l);
  const W = Math.min(400, r.width*0.34), w2 = W*0.62, h1 = W*9/16, h2 = w2*9/16, gap = 8, M = 12, top = 60;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const hitSeg = (x, y, w, h) => { for(let i = 0; i <= 60; i++){ const px = ax + (bx-ax)*i/60, py = ay + (by-ay)*i/60; if(px > x-10 && px < x+w+10 && py > y-10 && py < y+h+10) return true; } return false; };
  const over = (a, b2) => a && Math.max(0, Math.min(a.x+a.w, b2.x+b2.w) - Math.max(a.x, b2.x) + 10) * Math.max(0, Math.min(a.y+a.h, b2.y+b2.h) - Math.max(a.y, b2.y) + 10);
  // try eight spots around the point; skip ones that cover the flight line, a point or the other card
  function place(w, h, px, py, other){
    const g = 30, C = [[px+g, py-h/2], [px-g-w, py-h/2], [px-w/2, py-g-h], [px-w/2, py+g], [px+g, py-g-h], [px-g-w, py-g-h], [px+g, py+g], [px-g-w, py+g]];
    let best = null;
    for(const [cx, cy] of C){
      const x = clamp(cx, M, r.width-M-w), y = clamp(cy, top, r.height-M-h), R = {x, y, w, h};
      const s = (hitSeg(x, y, w, h) ? 1e6 : 0) + (other ? over(R, other) * 10 : 0) + Math.abs(x-cx) + Math.abs(y-cy);
      if(!best || s < best.s) best = {...R, s};
    }
    return best;
  }
  const gw = W, gh = h1 + gap + h2, G = place(gw, gh, ax, ay, null), L = place(w2, h2, bx, by, G);
  const gx = G.x, gy = G.y, lx = L.x, ly = L.y, lw = w2, lh = h2;
  const strip = `shots/${D.key}/${sel.k}.webp`;
  const card = (cls, x, y, w, h, n, lab, extra="") => `<div class="card ${cls}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px" data-f="${n}"><span class="fr s${n}" style="background-image:url('${strip}')" role="img" aria-label="${lab}"></span><span class="lab">${lab}</span>${extra}</div>`;
  const vid = !S.video ? "" : sel.video ? `<video class="vid" style="padding:0;width:100%;height:100%;object-fit:contain" src="${sel.video}" controls autoplay muted playsinline></video>` : `<div class="vid">Видео нет</div>`;
  cards.innerHTML =
    card("aim", gx, gy, W, h1, 1, "КУДА ЦЕЛИТЬСЯ", `<svg class="cross" viewBox="0 0 22 22"><path d="M11 3v6M11 13v6M3 11h6M13 11h6" stroke="#5dff8a" stroke-width="2"/></svg>${vid}<button class="play" data-play title="Видео">${icon(S.video?"x":"play")}</button>`) +
    card("", gx, gy + h1 + gap, w2, h2, 0, "ГДЕ СТОЯТЬ") +
    `<div class="card howc" style="left:${gx + w2 + gap}px;top:${gy + h1 + gap}px;width:${W - w2 - gap}px;height:${h2}px"><span class="lab">КАК КИДАТЬ</span>${howto(sel, "big")}</div>` +
    card("", lx, ly, lw, lh, 2, "КУДА ПАДАЕТ");
  // leader lines from cards to points
  const near = (x, y, w, h, px, py) => [clamp(px, x, x+w), clamp(py, y, y+h)];
  const [c1x,c1y] = near(gx, gy, gw, gh, ax, ay), [c2x,c2y] = near(lx, ly, lw, lh, bx, by);
  links.innerHTML += `<line x1="${c1x}" y1="${c1y}" x2="${ax}" y2="${ay}" stroke="#f0b443" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="${c2x}" y1="${c2y}" x2="${bx}" y2="${by}" stroke="#e7ecef88" stroke-width="1.2" stroke-dasharray="3 3"/>`;
  draw();
}
cards.addEventListener("click", e => {
  if(e.target.closest("[data-play]")){ S.video = !S.video; render(); return; }
  const c = e.target.closest(".card"); if(!c || c.classList.contains("howc") || S.video && c.classList.contains("aim")) return;
  // the aim frame opens as itself; the stand and land frames open as the tall picture with both
  const sel = D.items[S.sel], f = +c.dataset.f;
  const lb = document.createElement("div"); lb.className = "lb";
  lb.innerHTML = f === 1 ? `<span class="fr s1" style="background-image:url('shots/${D.key}/${sel.k}.webp')"></span>` : `<img src="shots/${D.key}/${sel.k}_big.webp" alt="">`;
  lb.onclick = () => lb.remove(); document.body.append(lb);
});

// side panel
function panel(sel, list){
  if(sel){
    side.innerHTML = `<div><div class="eyebrow">${KIND[sel.kind]} · ${sel.side.toUpperCase()}</div><h1>${sel.to}</h1><div class="from">${sel.from}</div></div>
      <div>${howto(sel, "big")}</div>
      ${S.video && innerWidth <= 760 ? (sel.video ? `<video style="width:100%;border-radius:8px;background:#000" src="${sel.video}" controls autoplay muted playsinline></video>` : `<div class="why">Видео нет</div>`) : ""}
      <div class="photos">${[[1,"КУДА ЦЕЛИТЬСЯ"],[0,"ГДЕ СТОЯТЬ"],[2,"КУДА ПАДАЕТ"]].map(([n,l]) => `<figure><span class="fr s${n}" style="background-image:url('shots/${D.key}/${sel.k}.webp')"></span><figcaption>${l}</figcaption></figure>`).join("")}</div>
      <div class="acts"><button class="btn main" id="pv">${icon("play")}Видео</button><button class="btn star" id="fv" aria-pressed="${FAV.ids.has(sel.slug)}" title="${FAV.ids.has(sel.slug) ? "Убрать из избранного" : "В избранное"}">★</button><button class="btn" id="close" title="Закрыть (Esc)">${icon("x")}</button></div>`;

    $("fv").onclick = () => toggleFav(sel.slug);

  }
  draw();
}

/* ---------- sections: one page, the rail switches them ---------- */
const L = DATA.lib, NI = DATA.ni, page = $("page");
const V = {view:"map", side:"t", cat:0};
const VIEWS = {map:"Карта гранат", board:"Доска", cfg:"Конфиги", nades:"Раскидки", names:"Названия"};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = (f, d) => { try { return f(localStorage); } catch(e){ return d; } };
const LM = () => L.maps[S.map];
function hashOf(){ return V.view === "map" ? `#${S.map}` : V.view === "cfg" ? "#cfg" : `#${S.map}-${V.view}${V.view === "nades" ? `-${V.side}-${V.cat+1}` : ""}${V.view === "board" ? (BD.doc ? "@" + BD.doc : BD.shared ? "~" + BD.shared : "") : ""}`; }
function route(){
  // #mirage (map), #mirage-board, #cfg, #mirage-nades-ct-2, #mirage-names; the old main-site form #mirage-nades-t-2 and #dust2-cfg-t too
  // #mirage-board~<code>: a board sent by link (shareLink below)
  const m = location.hash.match(/^#([a-z0-9]+)(?:-(map|board|cfg|nades|names))?(?:-(t|ct))?(?:-(\d+))?(?:~([A-Za-z0-9_-]+))?(?:@([A-Za-z0-9]+))?$/);
  let k = S.map || DATA.order[0], v = "map";
  if(m){ if(m[1] === "cfg") v = "cfg"; else if(DATA.maps[m[1]]){ k = m[1]; v = m[2] || "map"; } if(m[3]) V.side = m[3]; V.cat = m[4] ? +m[4]-1 : 0; }
  if(v === "names"){ v = "map"; S.names = true; }   // the old names section: the map with its names layer
  V.code = m && m[5] && v === "board" ? m[5] : "";
  V.bid = m && m[6] && v === "board" ? m[6] : "";
  if(V.bid && V.bid === BD.doc) V.bid = "";
  if(V.code && V.code === BD.shared) V.code = "";
  show(v, k); layerBtn(); paintImages();
}
function show(v, k){
  const first = !D; V.view = v;
  if(first || k !== S.map){ setMap(k); if(first) kindBtns(); loadBoard(); }
  if(v === "board" && V.code){ const c = V.code; V.code = ""; openShared(c); }
  if(v === "board" && V.bid){ const id = V.bid; V.bid = ""; FB.ready.then(() => openBoard(id)); }
  $("rail").querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === v));
  document.querySelector(".app").dataset.view = v; page.hidden = v === "map" || v === "board";
  history.replaceState(null, "", hashOf());
  document.title = (v === "cfg" ? "Конфиги" : `${VIEWS[v]} · ${DATA.maps[S.map].name}`) + " · S4";
  if(v === "map"){ fit(); render(); return; }
  if(v === "board"){ boardUI(); fit(); return; }
  paintPage(); page.scrollTop = 0;
}
$("rail").onclick = e => { const b = e.target.closest("[data-view]"); if(b) show(b.dataset.view, S.map); };
addEventListener("hashchange", route);

const segs = (list, cur, attr) => list.map(([v,l]) => `<button class="seg" data-${attr}="${v}" aria-pressed="${cur === v}">${l}</button>`).join("");
function header(){
  if(V.view === "cfg") return "";
  const maps = segs(DATA.order.map(k => [k, DATA.maps[k].name]), S.map, "pm");
  let more = "";
  if(V.view === "nades"){
    const cats = LM().sides[V.side], i = Math.min(V.cat, cats.length-1), cat = cats[i];
    more = `<div class="grp">${segs([["t","T"],["ct","CT"]], V.side, "ps")}</div><div class="grp cats2">${cats.map((g, k) => `<button class="seg" data-cat="${k}" aria-pressed="${k === i}">${esc(g.name)}</button>`).join("")}</div>` +
      (cat.lesson ? `<a class="seg lesson" href="${cat.lesson.url}${cat.lesson.start ? `&t=${cat.lesson.start}s` : ""}" target="_blank" rel="noopener" title="${esc(cat.lesson.text)}">${icon("play")}Урок</a>` : "");
  }
  return `<div class="ph"><div class="grp">${maps}</div>${more}</div>`;
}
function paintPage(){

const script = src => new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });

const snap = () => JSON.stringify({steps:BD.steps, cur:BD.cur});
function push(){ BD.undo.push(snap()); if(BD.undo.length > 100) BD.undo.shift(); BD.redo = []; }
function restore(s){ const b = JSON.parse(s); BD.steps = b.steps; BD.cur = Math.min(b.cur, b.steps.length-1); BD.sel = -1; saveBoard(); boardUI(); }

function redo(){ if(BD.redo.length){ BD.undo.push(snap()); restore(BD.redo.pop()); } }
function del(i){ objs().splice(i, 1); BD.sel = -1; saveBoard(); paint(); boardBars(); }

// drawing
const smooth = p => { if(p.length < 3) return p.map((q, i) => `${i ? "L" : "M"}${q[0]} ${q[1]}`).join(""); let d = `M${p[0][0]} ${p[0][1]}`; for(let i = 1; i < p.length-1; i++){ const mx = r1((p[i][0]+p[i+1][0])/2), my = r1((p[i][1]+p[i+1][1])/2); d += `Q${p[i][0]} ${p[i][1]} ${mx} ${my}`; } return d + `L${p.at(-1)[0]} ${p.at(-1)[1]}`; };

  if(p.length < 3) return p;

  return mx > tol ? simplify(p.slice(0, at+1), tol).slice(0, -1).concat(simplify(p.slice(at), tol)) : [p[0], p.at(-1)];

function skull(){

  return n ? n.map(([t, a]) => `<${t} ${Object.entries(a).map(([k, v]) => `${k}="${v}"`).join(" ")}/>`).join("") : `<path d="M6 6l12 12M18 6L6 18"/>`;

function cone(o, w, c){

function obj(o, i){

    let head = "";
    if(o.t === "arrow"){ const a = o.p.at(-2), b = o.p.at(-1), ang = Math.atan2(b[1]-a[1], b[0]-a[0]), h = w*4.5;
      head = `<polygon points="${b} ${r1(b[0]-h*Math.cos(ang-.45))},${r1(b[1]-h*Math.sin(ang-.45))} ${r1(b[0]-h*Math.cos(ang+.45))},${r1(b[1]-h*Math.sin(ang+.45))}" fill="${o.c}"/>`; }

  }
  if(o.t === "rect") return `<rect ${k} x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx="${w}" fill="${o.c}" fill-opacity=".14" stroke="${o.c}" stroke-width="${w*.8}"/>`;

  if(o.t === "text") return `<text ${k} x="${o.x}" y="${o.y}" fill="${o.c}" font-size="${w*5.2}" font-weight="600" font-family="Golos Text,system-ui,sans-serif" stroke="#0b0e10" stroke-width="${w*1.3}" paint-order="stroke" dominant-baseline="middle">${esc(o.s)}</text>`;
  const g = (inner, c) => `<g ${k} transform="translate(${o.x} ${o.y})">${turnable(o) ? cone(o, w, c) : ""}${inner}${turnable(o) && i === BD.sel && BD.tool === "select" ? handle(o, i, w) : ""}</g>`;

  if(o.t === "foe") return g(`<circle r="${w*3.2}" fill="#0b0e10" stroke="#ff5148" stroke-width="${w*1.1}"/><circle r="${w*1.1}" fill="#ff5148"/>`, "#ff5148");
  if(o.t === "c4"){ const r = w*3.6; return g(`<circle r="${r}" fill="#0b0e10" stroke="#ff5148" stroke-width="${w*.8}"/><image href="${NI.c4}" x="${-r*.7}" y="${-r*.7}" width="${r*1.4}" height="${r*1.4}"/>`); }
  if(o.t === "dead"){ const r = w*3.2, s = r*1.3/12; return g(`<circle r="${r}" fill="#0b0e10" stroke="#8b98a2" stroke-width="${w*.7}"/><g transform="translate(${-12*s} ${-12*s}) scale(${s})" fill="none" stroke="#e7ecef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${skull()}</g>`); }

    return `<g ${k}>${BD.traj ? `<line x1="${o.tx}" y1="${o.ty}" x2="${o.lx}" y2="${o.ly}" stroke="#000a" stroke-width="${w*1.6}" stroke-linecap="round"/><line x1="${o.tx}" y1="${o.ty}" x2="${o.lx}" y2="${o.ly}" stroke="${c}" stroke-width="${w*.9}" stroke-dasharray="${w*.2} ${w*2}" stroke-linecap="round"/>
      <circle cx="${o.tx}" cy="${o.ty}" r="${rt}" fill="#0b0e10" stroke="${c}" stroke-width="${w*.6}"/><image href="${NI[o.k]}" x="${o.tx-rt*.6}" y="${o.ty-rt*.6}" width="${rt*1.2}" height="${rt*1.2}"/>` : ""}

/* Sizes in game units, drawn with the map's radar scale (units per radar pixel, resource/overviews/de_<map>.txt):
   smoke radius 144 (counterstrike.fandom.com, Smoke Grenade; a CS2 smoke also pours into corridors, so the circle is a
   guide), fire median radius 117 measured over 46 recorded molotovs (memorin.app/mechanics/molotov-fire; the game's
   inferno_max_range is 150), HE blast about 350 with damage falling off to the edge (farmskins.com, 2026-10-11). A flash
   has no area: it blinds whoever sees it, so it is drawn as a burst. */
const BLAST = {smoke:144, molotov:117, he:350};
const BDEFS = `<radialGradient id="g-smoke"><stop offset="0" stop-color="#e8ecef" stop-opacity=".85"/><stop offset=".75" stop-color="#cfd6dc" stop-opacity=".7"/><stop offset="1" stop-color="#cfd6dc" stop-opacity=".25"/></radialGradient>
  <radialGradient id="g-fire"><stop offset="0" stop-color="#ffe066" stop-opacity=".9"/><stop offset=".5" stop-color="#ff8a2a" stop-opacity=".75"/><stop offset="1" stop-color="#e2401c" stop-opacity=".35"/></radialGradient>
  <radialGradient id="g-flash"><stop offset="0" stop-color="#fffbe0" stop-opacity="1"/><stop offset=".35" stop-color="#fff36b" stop-opacity=".8"/><stop offset="1" stop-color="#fff36b" stop-opacity="0"/></radialGradient>
  <radialGradient id="g-he"><stop offset="0" stop-color="#9be86a" stop-opacity=".35"/><stop offset="1" stop-color="#9be86a" stop-opacity="0"/></radialGradient>`;
function blast(kind, x, y, seed){
  const u = 1/(D.scale || 5), w = LW();
  if(kind === "smoke"){ const r = BLAST.smoke*u; return `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#g-smoke)" stroke="#f4f6f8" stroke-width="${w*.5}"/>`; }
  if(kind === "molotov"){
    // a ragged patch of fire cells about 48 units apart (memorin.app), inside the measured radius
    const R = BLAST.molotov*u, cell = 48*u; let h = 0; for(const ch of String(seed || x+y)) h = (h*31 + ch.charCodeAt(0)) >>> 0;
    const rnd = () => { h = (h*1103515245 + 12345) >>> 0; return h/4294967296; };
    let out = `<circle cx="${x}" cy="${y}" r="${R*.55}" fill="url(#g-fire)"/>`;
    for(let i = 0; i < 9; i++){ const a = i/9*Math.PI*2 + rnd()*.5, d = R*(.45 + rnd()*.3); out += `<circle cx="${r1(x + d*Math.cos(a))}" cy="${r1(y + d*Math.sin(a))}" r="${r1(cell*(.55 + rnd()*.3))}" fill="url(#g-fire)"/>`; }
    return out;
  }
  if(kind === "flash"){ const r = w*7, pts = Array.from({length:16}, (_, i) => { const a = i*Math.PI/8, q = i % 2 ? r*.4 : r; return `${r1(x + q*Math.cos(a))},${r1(y + q*Math.sin(a))}`; }).join(" ");
    return `<circle cx="${x}" cy="${y}" r="${r*1.6}" fill="url(#g-flash)"/><polygon points="${pts}" fill="#fff36b" stroke="#fffbe0" stroke-width="${w*.3}"/>`; }
  if(kind === "he"){ const R = BLAST.he*u, r = w*5, pts = Array.from({length:20}, (_, i) => { const a = i*Math.PI/10, q = i % 2 ? r*.5 : r; return `${r1(x + q*Math.cos(a))},${r1(y + q*Math.sin(a))}`; }).join(" ");
    return `<circle cx="${x}" cy="${y}" r="${R}" fill="url(#g-he)" stroke="#9be86a" stroke-opacity=".5" stroke-width="${w*.3}" stroke-dasharray="${w} ${w}"/><polygon points="${pts}" fill="#9be86a" stroke="#0b0e10" stroke-width="${w*.3}"/>`; }
  return "";
}
function handle(o, i, w){ const a = (o.a ?? -90)*Math.PI/180, R = w*8; return `<line x1="0" y1="0" x2="${r1(R*Math.cos(a))}" y2="${r1(R*Math.sin(a))}" stroke="#f0b443" stroke-width="${w*.4}" stroke-dasharray="${w} ${w}" pointer-events="none"/><circle data-h="${i}" cx="${r1(R*Math.cos(a))}" cy="${r1(R*Math.sin(a))}" r="${w*1.8}" fill="#f0b443" stroke="#0b0e10" stroke-width="${w*.5}" style="cursor:grab"/>`; }
const paintList = list => { $("bsvg").setAttribute("viewBox", `0 0 ${D.w} ${D.h}`); if(!$("bdefs").innerHTML) $("bdefs").innerHTML = BDEFS; $("objs").innerHTML = list; };
function paint(){ if(V.view !== "board") { $("objs").innerHTML = ""; return; } paintList(objs().map(obj).join("") + (BD.drag && BD.drag.ghost ? obj(BD.drag.ghost, -1) : "")); }

// pointer: one pointer draws or moves; a second finger, the middle button or a held Space pans and zooms like the map
function pt(e){ const r = stage.getBoundingClientRect(), k = base*S.z; return [r1((e.clientX - r.left - S.x)/k), r1((e.clientY - r.top - S.y)/k)]; }

function cancelDrag(){
  const d = BD.drag; BD.drag = null; if(!d) return;
  if(d.move !== undefined || d.turn !== undefined){ restore(BD.undo.pop()); return; }
  paint();
}
function boardDown(e){
  if(BD.play) stopPlay();
  if(BD.drag && e.pointerType === "touch"){ const d = BD.drag; cancelDrag(); if(d.last) P.set(d.pid, d.last); moved = 99; return true; }
  if(e.button === 1 || BD.space){ e.preventDefault(); return true; }
  const i = hit(e), o = objs()[i], cap = () => { BD.drag.pid = e.pointerId; BD.drag.last = [e.clientX, e.clientY]; (() => { try { stage.setPointerCapture(e.pointerId); } catch(_){} })(); };
  if(e.button === 2){ if(turnable(o)){ push(); BD.drag = {turn:i}; cap(); } return false; }   // right drag turns a token, as on Gamecoach
  if(e.button !== 0) return false;
  const p = pt(e), h = e.target.closest("[data-h]");
  if(h){ push(); BD.drag = {turn:+h.dataset.h}; cap(); return false; }
  if(BD.tool === "erase"){ if(i >= 0){ push(); del(i); } BD.drag = {erase:true}; cap(); return false; }
  if(i >= 0 && (BD.tool === "select" || ["tok","foe","c4","dead","nade","ln"].includes(o.t))){
    push(); if(BD.tool === "select") BD.sel = i; BD.drag = {move:i, from:p, o:clone(o), moved:false}; cap(); paint(); return false; }
  if(BD.tool === "select") return true;   // empty place: pan

  const c = COLORS[BD.color];
  if(BD.tool === "pen" || BD.tool === "arrow") BD.drag = {ghost:{t: BD.tool === "pen" ? "line" : "arrow", c, p:[p]}};
  else if(BD.tool === "rect") BD.drag = {ghost:{t:"rect", c, x:p[0], y:p[1], w:0, h:0}, from:p};
  else if(BD.tool === "circ") BD.drag = {ghost:{t:"circ", c, x:p[0], y:p[1], r:0}};

}
function boardMove(e){
  const d = BD.drag; if(d.pid !== undefined && e.pointerId !== d.pid) return;

  if(d.erase){ const el = document.elementFromPoint(e.clientX, e.clientY), x = el && el.closest("#objs [data-i]"); if(x){ push(); del(+x.dataset.i); } return; }
  const p = pt(e);
  if(d.turn !== undefined){ const o = objs()[d.turn]; o.a = Math.round(Math.atan2(p[1]-o.y, p[0]-o.x)*180/Math.PI); paint(); return; }
  if(d.move !== undefined){ const o = objs()[d.move], dx = p[0]-d.from[0], dy = p[1]-d.from[1];
    if(o.p) o.p = d.o.p.map(q => [r1(q[0]+dx), r1(q[1]+dy)]);
    else if(o.t === "ln"){ o.tx = r1(d.o.tx+dx); o.ty = r1(d.o.ty+dy); o.lx = r1(d.o.lx+dx); o.ly = r1(d.o.ly+dy); }
    else { o.x = r1(d.o.x+dx); o.y = r1(d.o.y+dy); }

  if(d.place) return;
  const g = d.ghost;
  if(g.t === "line" || g.t === "arrow"){ const l = g.p.at(-1); if(Math.hypot(p[0]-l[0], p[1]-l[1]) >= 3/(base*S.z)) g.p.push(p); }
  else if(g.t === "rect"){ g.x = Math.min(p[0], d.from[0]); g.y = Math.min(p[1], d.from[1]); g.w = r1(Math.abs(p[0]-d.from[0])); g.h = r1(Math.abs(p[1]-d.from[1])); }
  else if(g.t === "circ") g.r = r1(Math.hypot(p[0]-g.x, p[1]-g.y));

}
function boardUp(){
  const d = BD.drag; BD.drag = null; if(!d) return;
  if(d.place){ place(d.place); return; }
  if(BD.remote) setTimeout(applyRemote, 0);
  if(d.move !== undefined){ if(!d.moved) BD.undo.pop(); saveBoard(); paint(); boardBars(); return; }
  if(d.turn !== undefined){ saveBoard(); paint(); boardBars(); return; }
  if(d.erase) return;
  const g = d.ghost, w = LW();
  if(g.t === "line" || g.t === "arrow"){ g.p = simplify(g.p, w/3); if(Math.hypot(g.p.at(-1)[0]-g.p[0][0], g.p.at(-1)[1]-g.p[0][1]) > w*3 || g.p.length > 2){ commit(g); return; } }
  if(g.t === "rect" && g.w > w*2 && g.h > w*2){ commit(g); return; }
  if(g.t === "circ" && g.r > w*2){ commit(g); return; }
  paint();
}
function place(p){
  const [x, y] = p, t = BD.tool, list = objs();
  if(t === "tok"){ const n = Math.min(BD.color, 4)+1, o = list.find(o => o.t === "tok" && o.n === n); push(); if(o){ o.x = x; o.y = y; } else list.push({t:"tok", n, c:COLORS[n-1], x, y}); saveBoard(); paint(); boardBars(); return; }
  if(t === "c4"){ const o = list.find(o => o.t === "c4"); push(); if(o){ o.x = x; o.y = y; } else list.push({t:"c4", id:"c4", x, y}); saveBoard(); paint(); boardBars(); return; }
  if(t === "foe" || t === "dead") commit({t, id:uid(), x, y});
  else if(t === "nade") commit({t:"nade", k:BD.kind, id:uid(), x, y});
}
function textAt(p, i = -1){

  inp.className = "btext"; inp.value = i >= 0 ? objs()[i].s : ""; inp.placeholder = "Текст, Enter";
  inp.style.left = `${S.x + p[0]*k}px`; inp.style.top = `${S.y + p[1]*k - 16}px`;
  let done = false;
  const fin = ok => { if(done) return; done = true; const v = inp.value.trim(); inp.remove();
    if(!ok) return;

// steps, played one after another: tokens with the same number or id move, as on Gamecoach's slides
function goStep(k){ if(k < 0 || k >= BD.steps.length) return; if(BD.play) stopPlay(); BD.cur = k; BD.sel = -1; BD.sure = false; boardUI(); }
function addStep(){ push(); BD.steps.splice(BD.cur+1, 0, {o:objs().filter(o => KEEP.includes(o.t)).map(clone), note:""}); BD.cur++; BD.sel = -1; saveBoard(); boardUI(); }
function delStep(){ if(BD.steps.length < 2) return; push(); BD.steps.splice(BD.cur, 1); BD.cur = Math.min(BD.cur, BD.steps.length-1); BD.sel = -1; saveBoard(); boardUI(); }
const keyOf = o => o.t === "tok" ? "t" + o.n : o.id ? o.t + o.id : null;
function tween(a, b, k){
  const from = new Map(a.filter(keyOf).map(o => [keyOf(o), o])), out = [];
  a.forEach(o => { if(!KEEP.includes(o.t)) out.push(`<g opacity="${r1(1-k)}">${obj(o, -1)}</g>`); });
  b.forEach(o => { const f = from.get(keyOf(o)); if(!f || !KEEP.includes(o.t)) return;
    let da = ((o.a ?? f.a ?? 0) - (f.a ?? o.a ?? 0) + 540) % 360 - 180;
    out.push(obj({...o, x:f.x + (o.x-f.x)*k, y:f.y + (o.y-f.y)*k, a: o.a === undefined && f.a === undefined ? undefined : (f.a ?? o.a) + da*k}, -1)); });
  return out.join("");
}
function play(){
  if(BD.play){ stopPlay(); return; }
  if(BD.steps.length < 2) return;
  BD.sel = -1; BD.cur = 0; BD.play = {raf:0}; boardUI();
  const HOLD = 1500, MOVE = 1100; let t0 = performance.now();
  const tick = now => {
    if(!BD.play) return;
    const t = now - t0, last = BD.cur === BD.steps.length-1;
    if(t >= HOLD && !last && t < HOLD + MOVE){ const k = (t-HOLD)/MOVE, e = k < .5 ? 2*k*k : 1 - (-2*k+2)**2/2; paintList(tween(objs(), BD.steps[BD.cur+1].o, e)); }
    else if(t >= HOLD + MOVE && !last){ BD.cur++; t0 = now; boardUI(); }
    else if(t >= HOLD && last){ stopPlay(); return; }
    BD.play.raf = requestAnimationFrame(tick);
  };
  BD.play.raf = requestAnimationFrame(tick);
}
function stopPlay(){ if(!BD.play) return; cancelAnimationFrame(BD.play.raf); BD.play = null; boardUI(); }

// a picture of the step, and a link that carries the whole board (csdb.gg's tactical board keeps its board in the link too)
async function exportPng(){
  const src = S.names && D.names ? $("names") : $("radar"), w = src.naturalWidth, h = src.naturalHeight;
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h; const g = cv.getContext("2d");
  g.fillStyle = "#0e1216"; g.fillRect(0, 0, w, h); g.drawImage(src, 0, 0, w, h);
  const sel = BD.sel; BD.sel = -1; const body = `<defs>${BDEFS}</defs>` + objs().map(obj).join(""); BD.sel = sel;
  const im = new Image();
  await new Promise((ok, no) => { im.onload = ok; im.onerror = no; im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${D.w} ${D.h}">${body}</svg>`); });
  g.drawImage(im, 0, 0, w, h);
  cv.toBlob(b => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `${D.name}, шаг ${BD.cur+1}.png`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }, "image/png");
}
const b64u = u8 => { let s = ""; for(let i = 0; i < u8.length; i += 8192) s += String.fromCharCode(...u8.subarray(i, i+8192)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
async function pack(o){ return b64u(new Uint8Array(await new Response(new Blob([JSON.stringify(o)]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer())); }
async function unpack(code){ const u8 = Uint8Array.from(atob(code.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0)); return JSON.parse(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text()); }
async function shareLink(){
  const url = location.origin + location.pathname + (BD.doc ? `#${S.map}-board@${BD.doc}` : `#${S.map}-board~` + await pack({steps:BD.steps}));
  try { await navigator.clipboard.writeText(url); BD.msg = "Ссылка скопирована"; }
  catch(e){ history.replaceState(null, "", url); BD.msg = "Ссылка в адресной строке"; }
  toast(BD.msg); BD.msg = BD.url = "";
}
async function openShared(code){
  try { const b = await unpack(code); if(!Array.isArray(b.steps) || !b.steps.length) throw 0;
    BD.steps = b.steps; BD.cur = 0; BD.shared = code; BD.undo = []; BD.redo = []; BD.sel = -1; }
  catch(e){ BD.msg = "Ссылка повреждена"; }
  history.replaceState(null, "", hashOf()); boardUI(); if(BD.msg) toast(BD.msg); BD.msg = "";
}
function keepShared(){ BD.shared = ""; saveBoard(); history.replaceState(null, "", hashOf()); boardUI(); }
function ownBoard(){ loadBoard(); history.replaceState(null, "", hashOf()); boardUI(); }

/* ---------- configs: autoexec.cfg from a base with a few personal choices, cs2_video.txt patcher, practice ----------
The base is the owner's own autoexec.cfg (windows/cs2/autoexec.cfg, used in the game). «Про» is the same file with the
personal lines left to the game menu and the radar zoomed as most pros have it: cl_radar_scale 0.4 is the most common
value (48 of 161 players, psamethod.com, 2026-06-18). Every choice rewrites only its own lines of the base file.
The cs2_video.txt patcher copies hexui.com/cs2-fps-settings: the player's OWN file in, only the quality keys rewritten. */
function block(id, text, name){ return `<pre id="${id}">${esc(text)}</pre><div class="acts"><button type="button" class="btn" data-copy="${id}">Скопировать</button><button type="button" class="btn" data-save="${id}" data-name="${name}">Скачать ${name}</button></div>`; }

const cbLine = (t, re, v) => t.replace(re, m => v === null ? "" : m.replace(/"[^"]*"\s*$/, `"${v}"`));
const cbCut = (t, from, to) => { const a = t.indexOf(from), b = t.indexOf(to, a + 1); return a < 0 || b < 0 ? t : t.slice(0, a) + t.slice(b); };
/* one row per choice: options [value, label], what the base files use, and how a value rewrites the file */
const CB = [
 {id:"sens", n:"Чувствительность", t:"num", min:0.05, max:8, step:0.01, mine:"0.65", pro:null,
  apply:(t, v) => cbLine(t, /^sensitivity "[^"]*"\s*$/m, v)},
 {id:"cross", n:"Прицел", o:[["dot","Точка"],[null,"Из меню"]], mine:"dot", pro:null,
  apply:(t, v) => v ? t : cbCut(t, "// ---------- Прицел", "// ---------- Клавиши")},
 {id:"vm", n:"Оружие в руках", o:[["pro","68 / 2.5 / 0 / −1.5"],[null,"Из меню"]], mine:"pro", pro:"pro",
  apply:(t, v) => v ? t : t.replace(/^\/\/ Вьюмодель.*\n(viewmodel_[^\n]*\n)+/m, "")},
 {id:"radar", n:"Масштаб радара", t:"num", min:0.25, max:1, step:0.05, mine:"0.65", pro:"0.4",
  apply:(t, v) => cbLine(t, /^cl_radar_scale "[^"]*"\s*$/m, v)},
 {id:"vol", n:"Громкость", t:"num", min:0, max:1, step:0.05, mine:"0.65", pro:null,
  apply:(t, v) => cbLine(t, /^volume "[^"]*"\s*$/m, v)},
 {id:"jump", n:"Прыжок", o:[["wheel","Колесо мыши"],["space","Пробел"]], mine:"wheel", pro:"space",
  apply:(t, v) => v === "wheel" ? t : t.replace(/^\/\/ Прыжок на колесо[^\n]*\nbind "MWHEELUP" "\+jump"\nbind "MWHEELDOWN" "\+jump"\nunbind "SPACE"\n/m, 'bind "SPACE" "+jump"\nbind "MWHEELUP" "invprev"\nbind "MWHEELDOWN" "invnext"\n')},
 {id:"nades", n:"Гранаты", o:[["vxzc","V X Z C"],[null,"Не менять"]], mine:"vxzc", pro:"vxzc",
  apply:(t, v) => v ? t : t.replace(/^\/\/ Гранаты:[^\n]*\n(bind "[a-z]" "slot(6|7|8|10)"\n)+/m, "")}
];
const cbKEY = "cs2cfg2";
const cbS = {base:"mine", ov:{}};
(() => { const o = store(s => JSON.parse(s.getItem(cbKEY) || "{}"), {}); if(o.base === "pro") cbS.base = "pro"; if(o.ov && typeof o.ov === "object") for(const r of CB) if(r.id in o.ov) cbS.ov[r.id] = o.ov[r.id]; })();
const cbSave = () => store(s => s.setItem(cbKEY, JSON.stringify(cbS)));
const cbBase = r => r[cbS.base];
const cbVal = r => r.id in cbS.ov ? cbS.ov[r.id] : cbBase(r);
function cbBuild(){
  let t = L.cfg.own.replace(/\r\n/g, "\n");
  for(const r of CB) t = r.apply(t, cbVal(r));
  return t.replace(/\n{3,}/g, "\n\n");
}
function cbRow(r){
  const v = cbVal(r), chg = r.id in cbS.ov;
  const ctl = r.t === "num"
    ? `<input type="number" data-cbn="${r.id}" min="${r.min}" max="${r.max}" step="${r.step}" placeholder="из меню" value="${v === null ? "" : v}">`
    : `<div class="grp">${r.o.map(([x, l]) => `<button type="button" class="seg" data-cbo="${r.id}" data-v="${x === null ? "" : x}" aria-pressed="${v === x}">${l}</button>`).join("")}</div>`;
  return `<div class="cb-it" data-it="${r.id}"><span class="cb-n">${r.n}</span><div class="cb-c">${ctl}<button type="button" class="ib cb-rs" data-cbr="${r.id}" title="Сбросить" ${chg ? "" : "hidden"}>${icon("rotate-ccw")}</button></div></div>`;
}
function cbPaint(){ const g = $("cb-rows"); if(g) g.innerHTML = CB.map(cbRow).join(""); const pre = $("c-build"); if(pre) pre.textContent = cbBuild(); const b = $("cb-base"); if(b) b.innerHTML = cbBaseBtns(); draw(); }
const cbBaseBtns = () => [["mine","Мой"],["pro","Про"]].map(([k, l]) => `<button type="button" class="seg" data-cbb="${k}" aria-pressed="${cbS.base === k}">${l}</button>`).join("") +
  (Object.keys(cbS.ov).length ? `<button type="button" class="ib cb-rs" data-cbb="${cbS.base}" title="Сбросить всё">${icon("rotate-ccw")}</button>` : "");

/* ===== cs2_video.txt patcher ===== */
/* [key in the file without "setting.", Russian name, menu name, options [value, label]] */
const cbVK = [
 ["shaderquality", "Шейдеры", "Shader Detail", [["0","Низкие"],["1","Высокие"]]],
 ["r_texturefilteringquality", "Фильтрация текстур", "Texture Filtering Mode", [["0","Билинейная"],["1","Трилинейная"],["2","Анизотропная 2x"],["3","Анизотропная 4x"],["4","Анизотропная 8x"],["5","Анизотропная 16x"]]],
 ["msaa_samples", "Сглаживание MSAA", "Multisampling Anti-Aliasing", [["0","Выкл"],["2","2x"],["4","4x"],["8","8x"]]],
 // the menu's CMAA2 = msaa_samples 0 + r_csgo_cmaa_enable 1: Steam guides 910649536 (checked in game, 26.07.2025) and 3046217806
 ["r_csgo_cmaa_enable", "Сглаживание CMAA2", "CMAA2", [["0","Выкл"],["1","Вкл"]]],
 ["videocfg_shadow_quality", "Качество теней", "Global Shadow Quality", [["0","Низкое"],["1","Среднее"],["2","Высокое"],["3","Очень высокое"]]],
 ["videocfg_dynamic_shadows", "Динамические тени", "Dynamic Shadows", [["0","Только солнце"],["1","Все"]]],
 ["videocfg_texture_detail", "Модели и текстуры", "Model / Texture Detail", [["0","Низкие"],["1","Средние"],["2","Высокие"]]],
 ["videocfg_particle_detail", "Частицы", "Particle Detail", [["0","Низкие"],["1","Средние"],["2","Высокие"],["3","Очень высокие"]]],
 ["videocfg_ao_detail", "Затенение (AO)", "Ambient Occlusion", [["0","Выкл"],["2","2 (как в пресете High)"],["3","3 (как в пресете Very High)"]]],
 ["videocfg_hdr_detail", "HDR", "High Dynamic Range", [["-1","Качество"],["3","Производительность"]]],
 ["videocfg_fsr_detail", "FSR", "FidelityFX Super Resolution", [["0","Выкл"],["2","2 (как в пресете Medium)"],["3","3 (как в пресете Low)"]]],
 ["mat_vsync", "V-Sync", "Wait for Vertical Sync", [["0","Выкл"],["1","Вкл"]]],
 ["r_low_latency", "Низкая задержка", "NVIDIA Reflex / AMD Anti-Lag 2", [["0","Выкл"],["1","Вкл"],["2","Вкл + Boost (только NVIDIA)"]]]
];
/* Tier values in the order of cbVK. Source: bo5.gg 09.08.2026 table (low-end / mid-range / high-end), the narrower choice where it gives two;
   CMAA2 and Low shadows for the mid tier as in the prosettings.net guide (ноябрь 2026). */
const cbTiers = {
 weak:   ["Слабый ПК",   ["0","2","0","1","0","1","0","0","0","3","0","0","1"]],
 mid:    ["Средний ПК",  ["0","3","0","1","0","1","1","0","0","-1","0","0","1"]],
 strong: ["Сильный ПК",  ["0","4","2","0","1","1","1","0","0","-1","0","0","1"]]
};
const cbV = {name:"", bin:"", sel:{}, tier:"", err:""};
const cbRe = k => new RegExp(`(^[ \\t]*"setting\\.${k}"[ \\t]+")([^"\\r\\n]*)(")`, "m");
const cbGet = (bin, k) => { const m = cbRe(k).exec(bin); return m ? m[2] : null; };
function cbPatch(bin, sel){
  let out = bin; const changed = [], missing = [];
  for(const [k] of cbVK){
    const v = sel[k]; if(v === undefined || v === "") continue;
    const m = cbRe(k).exec(out); if(!m){ missing.push(k); continue; }
    if(m[2] === v) continue;
    const at = m.index + m[1].length;
    out = out.slice(0, at) + v + out.slice(at + m[2].length); changed.push([k, m[2], v]);
  }
  return {out, changed, missing};
}
const cbLabel = (k, v) => { const o = cbVK.find(x => x[0] === k)[3].find(x => x[0] === v); return o ? o[1] : v; };
function cbVideoTier(){
  return `<div class="grp">${Object.entries(cbTiers).map(([k, v]) => `<button type="button" class="seg" data-vtier="${k}" aria-pressed="${cbV.tier === k}">${v[0].replace(" ПК", "")}</button>`).join("")}</div>`;
}
function cbVideoBody(){
  if(!cbV.bin) return cbV.err ? `<p class="cb-warnp">${esc(cbV.err)}</p>` : "";
  const r = cbPatch(cbV.bin, cbV.sel);
  const rows = cbVK.map(([k, n, en, opts]) => { const cur = cbGet(cbV.bin, k), sel = cbV.sel[k] || "";
    return `<div class="cb-it"><span class="cb-n" title="${en}">${n}</span><select data-vk="${k}" aria-label="${esc(n)}" ${cur === null ? "disabled" : ""}><option value="">${cur === null ? "нет в файле" : cbLabel(k, cur)}</option>${opts.map(([x, l]) => `<option value="${x}" ${sel === x ? "selected" : ""}>${l}</option>`).join("")}</select></div>`; }).join("");
  return `<div class="cfgrow"><div id="cb-vtier">${cbVideoTier()}</div><button type="button" class="btn main" data-vdl ${r.changed.length ? "" : "disabled"}>${icon("download")}Скачать <span id="cb-vn">${r.changed.length ? `(${r.changed.length})` : ""}</span></button></div>
  <details class="cb-g"><summary>По одной</summary>${rows}</details>`;
}
const cbVideoPaint = () => { const e = $("cb-video"); if(e){ e.innerHTML = cbVideoBody(); draw(); } };

/* ===== events (the page click handler already does data-copy and data-save) ===== */
function cbSet(r, v){ if(JSON.stringify(v) === JSON.stringify(cbBase(r))) delete cbS.ov[r.id]; else cbS.ov[r.id] = v; cbSave(); }
const cbById = id => CB.find(r => r.id === id);
page.addEventListener("click", e => {
  if(V.view !== "cfg") return;
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.cbo){ cbSet(cbById(b.dataset.cbo), b.dataset.v || null); cbPaint(); return; }
  if(b.dataset.cbr){ delete cbS.ov[b.dataset.cbr]; cbSave(); cbPaint(); return; }
  if(b.dataset.cbb){ cbS.base = b.dataset.cbb; cbS.ov = {}; cbSave(); cbPaint(); return; }
  if(b.dataset.ct !== undefined){ navigator.clipboard.writeText(b.dataset.ct).then(() => { b.classList.add("ok"); setTimeout(() => b.classList.remove("ok"), 1200); }, () => {}); return; }
  if(b.dataset.vtier !== undefined){
    const t = b.dataset.vtier; cbV.tier = t;
    if(t) cbVK.forEach(([k], i) => { cbV.sel[k] = cbTiers[t][1][i]; }); else cbV.sel = {};
    cbVideoPaint(); return;
  }
  if(b.dataset.vdl !== undefined){
    const r = cbPatch(cbV.bin, cbV.sel), bytes = Uint8Array.from(r.out, c => c.charCodeAt(0));
    const x = document.createElement("a"); x.href = URL.createObjectURL(new Blob([bytes], {type:"text/plain"})); x.download = "cs2_video.txt"; x.click(); setTimeout(() => URL.revokeObjectURL(x.href), 1000);
  }
});
page.addEventListener("change", e => {
  if(V.view !== "cfg") return;
  const t = e.target;
  if(t.dataset.cbn){ const r = cbById(t.dataset.cbn), n = Number(t.value);
    if(t.value === "") cbSet(r, null); else if(isFinite(n) && n >= r.min && n <= r.max) cbSet(r, String(n)); cbPaint(); return; }
  if(t.dataset.vk){ cbV.sel[t.dataset.vk] = t.value; cbV.tier = ""; const n = cbPatch(cbV.bin, cbV.sel).changed.length; $("cb-vn").textContent = n ? `(${n})` : ""; page.querySelector("[data-vdl]").disabled = !n; $("cb-vtier").innerHTML = cbVideoTier(); return; }
  if(t.id === "cb-file" && t.files[0]){
    const f = t.files[0];
    if(f.size > 65536){ cbV.bin = ""; cbV.err = "Это не cs2_video.txt"; cbVideoPaint(); return; }
    f.arrayBuffer().then(buf => {
      const u = new Uint8Array(buf); let s = ""; for(let i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192));
      if(!/"video\.cfg"/.test(s) || !/"setting\.videocfg_/.test(s)){ cbV.bin = ""; cbV.err = "Это не cs2_video.txt"; }
      else { cbV.bin = s; cbV.name = f.name; cbV.sel = {}; cbV.tier = ""; cbV.err = ""; }
      cbVideoPaint();
    });
  }
});
(function(){
  const st = document.createElement("style");
  st.textContent = `
.cfg{gap:14px}
.cfgh,.cfgrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.cfgh h2{font:600 22px var(--display)}
.cfg .btn svg{width:17px;height:17px}
.cfg .btn:disabled{opacity:.4;cursor:default}
.cps{display:flex;flex-wrap:wrap;gap:8px}
.cp{display:flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:9px;background:var(--raise);color:var(--mute);font:500 13px ui-monospace,Consolas,monospace}
.cp svg{width:15px;height:15px}

.cb-rows{display:grid;max-width:640px}
.cb-it{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px;padding:8px 0;border-top:1px solid var(--line)}
.cb-c{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cb-rs{width:30px;height:30px}
.cb-rs svg{width:15px;height:15px}
.cb-g{border-top:1px solid var(--line);padding-top:8px;min-width:0}
.cb-g>summary{font:600 15px var(--display);letter-spacing:.02em;padding:4px 0}
.cfg pre{white-space:pre;max-height:360px}
.cfg input[type=number],.cfg select{background:var(--raise);color:var(--fg);border:1px solid var(--line);border-radius:9px;height:34px;padding:0 8px;font:inherit;max-width:100%;-webkit-user-select:text;user-select:text}
.cfg input[type=number]{width:96px}
.cfg select:disabled{opacity:.4}
.cfg details>summary{cursor:pointer;color:var(--mute);font-weight:600}
.cb-warnp{color:var(--molotov);margin:0}
.keysx{display:flex;flex-wrap:wrap;gap:8px 18px}
.keysx span{display:flex;align-items:center;gap:6px;color:var(--mute)}
.keysx kbd{font:700 12px/1 var(--body);color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}`;
  document.head.append(st);
})();

function cfgView(){
  const c = L.cfg, cp = (t, ic, label, title) => `<button type="button" class="cp" data-ct="${esc(t)}" title="${title}">${icon(ic)}${label}</button>`;
  const k = (keys, t) => `<span>${keys.map(x => `<kbd>${x}</kbd>`).join("")}${t}</span>`;
  setTimeout(cbPaint, 0);
  return `<section class="sheet cfg">
    <div class="cfgh"><h2>autoexec.cfg</h2><div class="grp" id="cb-base">${cbBaseBtns()}</div><div class="acts"><button type="button" class="btn main" data-save="c-build" data-name="autoexec.cfg">${icon("download")}Скачать</button><button type="button" class="btn" data-copy="c-build">Скопировать</button></div></div>
    <div class="cps">${cp("C:\\Program Files (x86)\\Steam\\steamapps\\common\\Counter-Strike Global Offensive\\game\\csgo\\cfg", "folder", "…\\game\\csgo\\cfg", "Куда положить. Скопировать путь")}${cp("+exec autoexec.cfg", "rocket", "+exec autoexec.cfg", "Steam → CS2 → Свойства → Параметры запуска. Скопировать")}</div>
    <div class="cb-rows" id="cb-rows"></div>
    <details><summary>Файл</summary><pre id="c-build"></pre></details></section>
  <section class="sheet cfg">
    <div class="cfgh"><h2>Графика</h2><label class="btn main filebtn">${icon("folder-open")}Открыть cs2_video.txt<input type="file" id="cb-file" accept=".txt,text/plain"></label></div>
    <div class="cps">${cp("C:\\Program Files (x86)\\Steam\\userdata", "folder", "Steam\\userdata\\…\\730\\local\\cfg", "Где файл. Игру закрыть, копию сохранить. Скопировать путь")}</div>
    <div id="cb-video">${cbVideoBody()}</div></section>
  <section class="sheet cfg">
    <div class="cfgh"><h2>Практика</h2><div class="acts"><button type="button" class="btn main" data-save="c-prac" data-name="prac.cfg">${icon("download")}prac.cfg</button><button type="button" class="btn" data-save="c-fshost" data-name="fshost.cfg" title="Для бесплатного сервера FSHOST: fake_rcon_password, затем exec fshost">${icon("download")}fshost.cfg</button></div></div>
    <div class="cps">${cp("exec prac", "terminal", "exec prac", "В консоли после загрузки карты. Скопировать")}</div>
    <div class="keysx">${k(["N"], "повтор")}${k(["6","7","8","9"], "гранаты")}${k(["0"], "убрать дым")}${k(["[","]"], "бот")}${k(["Caps","Alt"], "полёт")}</div>
    <pre id="c-prac" hidden>${esc(c.prac)}</pre><pre id="c-fshost" hidden>${esc(c.fshost)}</pre></section>`;
}


S.only = store(s => s.getItem("cs2only") === "1", false); favBtns(); sideBtns(); route(); draw();
if(L.fb) connectFav();
</script>
