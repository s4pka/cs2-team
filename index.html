<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>База команды</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;700&family=Oswald:wght@500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a team cheat sheet. One bar picks the map and the view; lineups read top to bottom in round order; the board fills the screen for a demo review. */
:root{--bg:#eef0ea;--panel:#fafbf7;--panel2:#e3e6dd;--fg:#1b211c;--muted:#5a645c;--line:#c9cfc3;--ct:#1f6a9c;--warn:#8a4b00;--ink:#0b0e10;
--display:"Oswald","Arial Narrow",sans-serif;--body:"Golos Text",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191a;--panel:#1e2425;--panel2:#2a3133;--fg:#e8ece6;--muted:#a3aea6;--line:#384143;--ct:#6cb8ea;--warn:#f0b866;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15191a;--panel:#1e2425;--panel2:#2a3133;--fg:#e8ece6;--muted:#a3aea6;--line:#384143;--ct:#6cb8ea;--warn:#f0b866;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2rem}h2{font-size:1.4rem}h3{font-size:1.2rem}
p{margin:0;max-width:72ch}
a{color:inherit;text-underline-offset:3px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ct);outline-offset:2px}
.muted{color:var(--muted);font-size:.92rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .in{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 18px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grp{display:flex;flex-wrap:wrap;gap:4px}
.grp button{font:500 1rem var(--display);letter-spacing:.03em;padding:5px 11px;border-radius:4px;border:1px solid var(--line)}
.grp button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grp button small{font:500 .8rem var(--mono);opacity:.7;margin-left:4px}
.list{display:grid;gap:14px}
.sheet{background:var(--panel);border:1px solid var(--line);padding:12px 14px;display:grid;gap:10px;min-width:0;scroll-margin-top:64px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 14px}
.head h3{display:flex;align-items:center;gap:10px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin:0;background:var(--line);border:1px solid var(--line)}
.facts div{min-width:0;background:var(--panel2);padding:7px 12px}
.facts dt{font-size:.8rem;color:var(--muted)}
.facts dd{margin:0;font-weight:700;line-height:1.3}
.clock{font-family:var(--mono);font-variant-numeric:tabular-nums}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;width:100%;padding:0;cursor:zoom-in;text-align:left}
.strip>span{display:grid;gap:2px;min-width:0}
.fr{display:block;aspect-ratio:16/9;background:var(--panel2) var(--src) no-repeat;background-size:300% 100%}
.cap{font-size:.8rem;color:var(--muted)}
.glyph{width:30px;height:30px;border-radius:50%;background:var(--ink);border:3px solid var(--c);color:var(--c);font:700 .9rem/24px var(--body);text-align:center;flex:none}
.task{display:grid;gap:8px}
.lead{font-size:1.06rem;max-width:80ch}
.closes{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 18px}
.closes li{display:flex;align-items:center;gap:8px}
.star{font-size:1.5rem;line-height:1;padding:0 4px;color:var(--muted)}
.star[aria-pressed="true"]{color:#e8a600}
.link{padding:0;font-weight:700;text-decoration:underline;text-underline-offset:3px;text-align:left}
.zoomable{display:block;width:100%;padding:0;cursor:zoom-in}
.zoomable img{display:block;width:100%;height:auto}
dialog{border:0;padding:0;background:#000;max-width:96vw;max-height:94vh;overflow:auto}
dialog img{display:block;max-width:96vw;width:auto;height:auto}
dialog::backdrop{background:rgba(0,0,0,.8)}
@media (max-width:760px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:1.6rem}.strip{grid-template-columns:1fr;gap:8px}
  .bar{position:static}.bar .in{gap:6px 12px}.grp button{padding:3px 8px;font-size:.95rem}}
/* board */
.wrap:has(#bd){max-width:1560px;padding-block:8px 16px}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tools .sep{width:8px}
.tb{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.tb[aria-pressed="true"]{outline:3px solid var(--ct);outline-offset:-1px}
.tb.nd{background:var(--ink)}
.tb img{width:28px;height:28px;object-fit:contain}
.tb .sw{width:22px;height:22px;border-radius:50%;background:var(--c);border:2px solid var(--ink);color:var(--ink);font:700 .8rem/18px var(--body);text-align:center}
.tb.wide{width:auto;padding:0 12px;font-weight:500}
.tb.danger{background:#c62f28;color:#fff;border-color:#c62f28}
.ic{width:22px;height:22px}
#bd{position:relative;width:min(100%,calc((100dvh - var(--top,150px)) * var(--ar)));margin:0 auto;background:var(--ink);touch-action:none;user-select:none}
#bd svg{display:block;width:100%;height:auto}
#bd[data-tool="pen"],#bd[data-tool="arrow"]{cursor:crosshair}
#bd[data-tool="erase"]{cursor:cell}
#bd [data-i]{cursor:grab}
#bd:fullscreen{width:auto;height:100%;aspect-ratio:var(--ar);background:var(--ink)}
/* configs */
.cfg{display:grid;gap:10px}
.cfg>*{min-width:0}
.cfg ol,.cfg ul{margin:0;padding-left:1.3em;display:grid;gap:4px;max-width:80ch}
code{font:500 .9em var(--mono);background:var(--panel2);padding:1px 5px;border-radius:3px}
pre{margin:0;font:500 .85rem/1.5 var(--mono);background:var(--panel2);border:1px solid var(--line);padding:10px 12px;overflow:auto;max-height:420px}
.copy{justify-self:start;margin:0 8px 0 0;font:500 .95rem var(--body);padding:6px 12px;border:1px solid var(--fg);border-radius:4px;background:var(--fg);color:var(--bg)}
.keys{border-collapse:collapse}
.keys td{border-bottom:1px solid var(--line);padding:4px 14px 4px 0;vertical-align:top}
.keys td:first-child{font:500 .9rem var(--mono);white-space:nowrap}
details>*+*{margin-top:8px}
details summary{cursor:pointer;font-weight:500}
.keys td code{word-break:break-all}
.tw{overflow-x:auto}
.gfx{border-collapse:collapse;width:100%;min-width:640px;font-size:.95rem}
.gfx th{text-align:left;font-weight:500;color:var(--muted);font-size:.85rem;border-bottom:1px solid var(--line);padding:4px 10px 4px 0}
.gfx td{border-bottom:1px solid var(--line);padding:6px 10px 6px 0;vertical-align:top}
.gfx td:first-child{font-weight:700}
.gfx td:nth-child(2){font-weight:700;color:var(--ct)}
.gfx small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

/* ---------- favourites ---------- */
/* One shared list in Firestore (doc team/fav, field ids) when the build carries a Firebase config; otherwise this browser's storage. */
const FAV = {ids:new Set(store(s => JSON.parse(s.getItem("cs2fav")||"[]"),[])), doc:null};
const isFav = x => FAV.ids.has(x.slug);
function toggleFav(id){
  const on = !FAV.ids.has(id);
  if(on) FAV.ids.add(id); else FAV.ids.delete(id);
  if(FAV.doc){ const F = firebase.firestore.FieldValue; FAV.doc.set({ids: on ? F.arrayUnion(id) : F.arrayRemove(id)},{merge:true}).catch(() => {}); }
  else store(s => s.setItem("cs2fav",JSON.stringify([...FAV.ids])));
  render();
}
const script = src => new Promise((ok,no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
async function connectFav(){
  try {
    const v = "https://www.gstatic.com/firebasejs/10.12.2/";
    await script(v+"firebase-app-compat.js"); await script(v+"firebase-firestore-compat.js");
    firebase.initializeApp(D.fb);
    FAV.doc = firebase.firestore().doc("team/fav");
    FAV.doc.onSnapshot(s => { FAV.ids = new Set((s.data()||{}).ids||[]); if(state.tab==="nades") render(); }, () => {});
  } catch(e){}
}

/* ---------- names ---------- */
function namesView(){
  const m = M();
  return `<h1>${m.name}: названия</h1>
    <button type="button" class="zoomable" data-big="${m.image}" aria-label="Открыть карту крупно"><img src="${m.image}" width="${m.w}" height="${m.h}" alt="Карта ${m.name} с названиями позиций"></button>
    <p class="muted">Крупно: как говорят игроки, мелко: название в игре. Источник: reskins.gg.</p>`;
}

/* ---------- lineups ---------- */
function card(x){
  const [g,c] = NADE[x.kind], fact = (k,v,cl="") => `<div><dt>${k}</dt><dd${cl?` class="${cl}"`:""}>${esc(v)}</dd></div>`;
  return `<article class="sheet" id="n-${x.k}">
    <div class="head"><h3><span class="glyph" style="--c:${c}">${g}</span>${KIND[x.kind]}: ${esc(x.to)}<button type="button" class="star" data-fav="${x.slug}" aria-pressed="${isFav(x)}" title="${isFav(x)?"Убрать из избранного":"В избранное"}" aria-label="Избранное">★</button></h3><a class="muted" href="https://nades.ai/${x.slug}" target="_blank" rel="noopener">на nades.ai</a></div>
    <dl class="facts">${fact("Откуда",x.from)}${fact("Как бросать",x.tech)}${fact("Кнопка",x.mouse)}${fact("Время раунда",x.clock,"clock")}</dl>
    <button type="button" class="strip" data-big="${x.big||x.img}" aria-label="Открыть кадры крупно" style="--src:url('${x.img}')">${FRAMES.map((t,i) => `<span><span class="fr" role="img" aria-label="${t}" style="background-position:${i*50}% 0"></span><span class="cap">${t}</span></span>`).join("")}</button>
    <p class="muted">Про бросали ${x.n} раз за 3 месяца${x.diff?`, сложность: ${x.diff}`:""}.</p>
  </article>`;
}
function nadesView(){
  const cats = M().sides[state.side], i = Math.min(state.cat,cats.length-1), cat = cats[i];
  const picks = cats.map((g,k) => `<button type="button" data-cat="${k}" aria-pressed="${k===i}">${esc(g.name)}<small>${g.items.length}</small></button>`).join("");
  const dup = t => cat.items.filter(x => x.to===t).length>1;
  const list = cat.items.map(x => { const [g,c] = NADE[x.kind]; return `<li><span class="glyph" style="--c:${c}">${g}</span><button type="button" class="link" data-go="${x.k}">${isFav(x)?"★ ":""}${esc(x.to)}${dup(x.to)?` (${esc(x.from)})`:""}</button></li>`; }).join("");
  const items = [...cat.items].sort((a,b) => isFav(b)-isFav(a));
  return `<h1>${M().name}: раскидка ${state.side==="t"?"за Т":"за КТ"}</h1>
    <div class="grp" id="cats">${picks}</div>
    <section class="task"><h2>${esc(cat.name)}</h2><p class="lead">${esc(cat.why)}</p><ul class="closes">${list}</ul>
    <p class="muted">★ ${D.fb?"— общее избранное команды: отмеченные раскидки стоят первыми у всех.":"— избранное в этом браузере: отмеченные раскидки стоят первыми."}</p></section>
    <div class="list">${items.map(card).join("")}</div>`;
}

/* ---------- board ---------- */
const B = {tool:"pen",color:0,kind:"",objs:[],undo:[],drag:null,sure:false};
const BKEY = () => "cs2board:"+state.map;
function loadBoard(){ B.objs = store(s => JSON.parse(s.getItem(BKEY())||"[]"),[]); B.undo = []; B.sure = false; }
function saveBoard(){ store(s => s.setItem(BKEY(),JSON.stringify(B.objs))); }
function push(){ B.undo.push(JSON.stringify(B.objs)); if(B.undo.length>100) B.undo.shift(); }
const smooth = p => { if(p.length<3) return p.map((q,i) => `${i?"L":"M"}${q[0]} ${q[1]}`).join(""); let d = `M${p[0][0]} ${p[0][1]}`; for(let i=1;i<p.length-1;i++){ const mx = (p[i][0]+p[i+1][0])/2, my = (p[i][1]+p[i+1][1])/2; d += `Q${p[i][0]} ${p[i][1]} ${mx} ${my}`; } return d+`L${p.at(-1)[0]} ${p.at(-1)[1]}`; };
function simplify(p,tol){
  if(p.length<3) return p;
  const dist = (q,a,b) => { const dx = b[0]-a[0], dy = b[1]-a[1], l = Math.hypot(dx,dy)||1; return Math.abs(dy*q[0]-dx*q[1]+b[0]*a[1]-b[1]*a[0])/l; };
  let mx = 0, at = 0; for(let i=1;i<p.length-1;i++){ const d = dist(p[i],p[0],p.at(-1)); if(d>mx){ mx = d; at = i; } }
  return mx>tol ? simplify(p.slice(0,at+1),tol).slice(0,-1).concat(simplify(p.slice(at),tol)) : [p[0],p.at(-1)];
}
function draw(o,i){
  const k = `data-i="${i}"`, w = M().w/220;
  if(o.t==="line") return `<path ${k} d="${smooth(o.p)}" fill="none" stroke="${o.c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  if(o.t==="arrow"){ const [a,b] = o.p, ang = Math.atan2(b[1]-a[1],b[0]-a[0]), h = w*4.5, p1 = [b[0]-h*Math.cos(ang-.45),b[1]-h*Math.sin(ang-.45)], p2 = [b[0]-h*Math.cos(ang+.45),b[1]-h*Math.sin(ang+.45)];
    return `<g ${k}><line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${o.c}" stroke-width="${w}" stroke-linecap="round"/><polygon points="${b} ${p1} ${p2}" fill="${o.c}"/></g>`; }
  if(o.t==="tok") return `<g ${k} transform="translate(${o.x} ${o.y})"><circle r="${w*3.6}" fill="${o.c}" stroke="#0b0e10" stroke-width="${w*.8}"/><text text-anchor="middle" dy=".35em" font-size="${w*4.4}" font-weight="700" font-family="system-ui,sans-serif" fill="#0b0e10">${o.n}</text></g>`;
  if(o.t==="nade"){ const r = w*3.4, c = NADE[o.k][1]; return `<g ${k} transform="translate(${o.x} ${o.y})"><circle r="${r}" fill="#0b0e10" stroke="${c}" stroke-width="${w*.7}"/><image href="${NI[o.k]}" x="${-r*.62}" y="${-r*.62}" width="${r*1.24}" height="${r*1.24}"/></g>`; }
  return "";
}
function paint(){ const g = document.getElementById("objs"); if(g) g.innerHTML = B.objs.map(draw).join("")+(B.drag&&B.drag.ghost?draw(B.drag.ghost,-1):""); }
function boardView(){
  const m = M(), t = (id,label,inner,on,cls="") => `<button type="button" class="tb ${cls}" data-tool="${id}" aria-pressed="${on}" title="${label}" aria-label="${label}">${inner}</button>`;
  const colors = COLORS.map((c,i) => `<button type="button" class="tb" data-color="${i}" aria-pressed="${B.color===i}" title="${i<5?`Игрок ${i+1} (клавиша ${i+1})`:"Белый (клавиша 6)"}" aria-label="${i<5?`Цвет игрока ${i+1}`:"Белый"}"><span class="sw" style="--c:${c}"></span></button>`).join("");
  const nades = Object.keys(NADE).map(k => t("nade:"+k,KIND[k],`<img src="${NI[k]}" alt="">`,B.tool==="nade"&&B.kind===k,"nd")).join("");
  return `<div class="tools" id="tools">${colors}<span class="sep"></span>
    ${t("pen","Рисовать (Q)",ic("pen"),B.tool==="pen")}${t("arrow","Стрелка (W)",ic("arrow"),B.tool==="arrow")}
    ${t("tok","Игрок с номером (E)",`<span class="sw" style="--c:${COLORS[Math.min(B.color,4)]}">${Math.min(B.color,4)+1}</span>`,B.tool==="tok")}${nades}
    ${t("erase","Стереть (R)",ic("erase"),B.tool==="erase")}<span class="sep"></span>
    <button type="button" class="tb" data-act="undo" title="Отменить (Ctrl+Z)" aria-label="Отменить">${ic("undo")}</button>
    <button type="button" class="tb wide ${B.sure?"danger":""}" data-act="clear">${B.sure?"Точно?":"Очистить"}</button>
    <button type="button" class="tb" data-act="full" title="Во весь экран" aria-label="Во весь экран">${ic("full")}</button></div>
    <div id="bd" data-tool="${B.tool}" style="--ar:${m.w/m.h}"><svg id="bsvg" viewBox="0 0 ${m.w} ${m.h}" aria-label="Доска: карта ${m.name}"><image href="${m.image}" width="${m.w}" height="${m.h}"/><g id="objs"></g></svg></div>`;
}
function pt(e){ const s = document.getElementById("bsvg"), p = s.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const q = p.matrixTransform(s.getScreenCTM().inverse()); return [Math.round(q.x),Math.round(q.y)]; }
function hit(e){ const el = e.target.closest("[data-i]"); return el ? +el.dataset.i : -1; }
function down(e){
  if(!e.target.closest("#bd")) return;
  e.preventDefault(); const p = pt(e), i = hit(e), c = COLORS[B.color];
  if(B.tool==="erase"){ if(i>=0){ push(); B.objs.splice(i,1); saveBoard(); paint(); } B.drag = {erase:true}; return; }
  if(i>=0 && (B.objs[i].t==="tok"||B.objs[i].t==="nade")){ push(); B.drag = {move:i,from:p,o:{...B.objs[i]}}; return; }
  if(B.tool==="pen") B.drag = {ghost:{t:"line",c,p:[p]}};
  else if(B.tool==="arrow") B.drag = {ghost:{t:"arrow",c,p:[p,p]}};
  else if(B.tool==="tok"){ push(); const n = Math.min(B.color,4)+1; B.objs = B.objs.filter(o => !(o.t==="tok"&&o.n===n)); B.objs.push({t:"tok",c:COLORS[n-1],n,x:p[0],y:p[1]}); saveBoard(); paint(); }
  else if(B.tool==="nade"){ push(); B.objs.push({t:"nade",k:B.kind,x:p[0],y:p[1]}); saveBoard(); paint(); }
}
function move(e){
  const d = B.drag; if(!d) return;
  if(d.erase){ const el = document.elementFromPoint(e.clientX,e.clientY), x = el&&el.closest("[data-i]"); if(x&&+x.dataset.i>=0){ push(); B.objs.splice(+x.dataset.i,1); saveBoard(); paint(); } return; }
  const p = pt(e);
  if(d.move!==undefined){ const o = B.objs[d.move]; o.x = d.o.x+p[0]-d.from[0]; o.y = d.o.y+p[1]-d.from[1]; paint(); return; }
  const g = d.ghost;
  if(g.t==="line"){ const l = g.p.at(-1); if(Math.hypot(p[0]-l[0],p[1]-l[1])>=M().w/400) g.p.push(p); }
  else g.p[1] = p;
  paint();
}
function up(){
  const d = B.drag; B.drag = null; if(!d) return;
  if(d.move!==undefined){ saveBoard(); return; }
  if(d.ghost){ const g = d.ghost;
    if(g.t==="line" && g.p.length>1){ g.p = simplify(g.p,M().w/700); push(); B.objs.push(g); }
    if(g.t==="arrow" && Math.hypot(g.p[1][0]-g.p[0][0],g.p[1][1]-g.p[0][1])>M().w/80){ push(); B.objs.push(g); }
    saveBoard(); }
  paint();
}
function undo(){ if(!B.undo.length) return; B.objs = JSON.parse(B.undo.pop()); saveBoard(); paint(); }
function setTool(v){ if(v.startsWith("nade:")){ B.tool = "nade"; B.kind = v.slice(5); } else B.tool = v; B.sure = false; render(); }
function fitBoard(){ const bd = document.getElementById("bd"); if(bd) bd.style.setProperty("--top",`${Math.ceil(bd.getBoundingClientRect().top+window.scrollY)+12}px`); }

/* ---------- configs ---------- */
// The team copy is a local file, so it can also save the block as a .cfg (Blob + a[download]).
function block(id,text,name){ return `<pre id="${id}">${esc(text)}</pre><button type="button" class="copy" data-copy="${id}">Скопировать</button>${D.team?`<button type="button" class="copy" data-save="${id}" data-name="${name}">Скачать ${name}</button>`:""}`; }

/* ---------- shell ---------- */
function buttons(id,list,key){ document.getElementById(id).innerHTML = list.map(([v,l]) => `<button type="button" data-v="${v}" aria-pressed="${state[key]===v}">${l}</button>`).join(""); }
function render(){
  buttons("maps",MAPS,"map"); buttons("tabs",TABS,"tab"); buttons("sides",SIDES,"side");
  document.getElementById("sides").hidden = state.tab!=="nades";
  document.getElementById("maps").hidden = state.tab==="cfg";
  const v = {names:namesView,nades:nadesView,board:boardView,cfg:cfgView}[state.tab];
  document.getElementById("root").innerHTML = v();
  if(state.tab==="board"){ paint(); fitBoard(); }
}
const hash = () => `#${state.map}-${state.tab}-${state.side}${state.tab==="nades"?`-${state.cat+1}`:""}`;
function go(){ history.replaceState(null,"",hash()); if(state.tab==="board") loadBoard(); render(); window.scrollTo(0,0); }
function fromHash(){
  const m = location.hash.match(/^#([a-z0-9]+)-(names|nades|board|cfg)-(t|ct)(?:-(\d+))?$/);
  if(m && D.maps[m[1]]){ state.map = m[1]; state.tab = m[2]; state.side = m[3]; state.cat = m[4] ? +m[4]-1 : 0; }
  loadBoard(); render();
}
for(const [id,key] of [["maps","map"],["tabs","tab"],["sides","side"]]) document.getElementById(id).addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return; state[key] = b.dataset.v; state.cat = 0; go(); });
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",fitBoard);
const zoom = document.getElementById("zoom");
zoom.addEventListener("click", () => zoom.close());
const ROOT = document.getElementById("root");
ROOT.addEventListener("pointerdown",down);
window.addEventListener("pointermove",move); window.addEventListener("pointerup",up); window.addEventListener("pointercancel",up);
ROOT.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.fav){ toggleFav(b.dataset.fav); return; }
  if(b.dataset.cat){ state.cat = +b.dataset.cat; go(); return; }
  if(b.dataset.go){ document.getElementById(`n-${b.dataset.go}`).scrollIntoView({block:"start"}); return; }
  if(b.dataset.big){ zoom.innerHTML = `<img src="${b.dataset.big}" alt="${esc(b.getAttribute("aria-label")||"")}">`; zoom.showModal(); return; }
  if(b.dataset.copy){ const pre = document.getElementById(b.dataset.copy), done = () => { b.textContent = "Скопировано"; setTimeout(() => b.textContent = "Скопировать",1500); };
    navigator.clipboard.writeText(pre.textContent).then(done, () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Выделено: Ctrl+C"; }); return; }
  if(b.dataset.save){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([document.getElementById(b.dataset.save).textContent],{type:"text/plain"})); a.download = b.dataset.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href),1000); return; }
  if(b.dataset.color){ B.color = +b.dataset.color; if(B.tool==="erase"||B.tool==="nade") B.tool = "pen"; B.sure = false; render(); return; }
  if(b.dataset.tool){ setTool(b.dataset.tool); return; }
  if(b.dataset.act==="undo"){ undo(); return; }
  if(b.dataset.act==="clear"){ if(!B.sure){ B.sure = true; render(); return; } push(); B.objs = []; B.sure = false; saveBoard(); render(); return; }
  if(b.dataset.act==="full"){ const bd = document.getElementById("bd"); if(bd.requestFullscreen) bd.requestFullscreen().catch(() => {}); return; }
});
window.addEventListener("keydown", e => {
  if(state.tab!=="board" || e.target.matches("input,textarea")) return;
  if((e.ctrlKey||e.metaKey) && e.code==="KeyZ"){ e.preventDefault(); undo(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const n = "123456".indexOf(e.key); if(n>=0){ B.color = n; render(); return; }
  const t = {KeyQ:"pen",KeyW:"arrow",KeyE:"tok",KeyR:"erase"}[e.code]; if(t) setTool(t);
});
fromHash();
if(D.fb) connectFav();
</script>
